            const moveTab = (index, direction) => {
                const newTabs = [...settings.tabsOrder];
                if(direction === 'up' && index > 0) { [newTabs[index-1], newTabs[index]] = [newTabs[index], newTabs[index-1]]; } 
                else if (direction === 'down' && index < newTabs.length - 1) { [newTabs[index+1], newTabs[index]] = [newTabs[index], newTabs[index+1]]; }
                updateSetting('tabsOrder', newTabs);
            };

            // Export / Import logic
            const exportData = () => {
                haptic();
                const data = { vault, playlists, settings };
                const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; 
                a.download = `OmniVault_Backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast("Data Exported!");
            };

            const importData = (e) => {
                const file = e.target.files[0];
                if(!file) return;
                haptic();
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if(data.vault) { setVault(data.vault); localStorage.setItem('omni16_data', JSON.stringify(data.vault)); }
                        if(data.playlists) { setPlaylists(data.playlists); localStorage.setItem('omni16_lists', JSON.stringify(data.playlists)); }
                        if(data.settings) { setSettings(data.settings); localStorage.setItem('omni16_settings', JSON.stringify(data.settings)); }
                        showToast("Data Imported! Reloading in 1s...");
                        setTimeout(() => window.location.reload(), 1200);
                    } catch(err) { showToast("Invalid Format"); }
                };
                reader.readAsText(file);
            };

            // AI Logic
            const askAI = async (promptText) => {
                if (!settings.aiKey || settings.aiKey.trim() === "") return { error: "Missing API Key." };
                try {
                    const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                        method: "POST", 
                        headers: { "Authorization": `Bearer ${settings.aiKey.trim()}`, "Content-Type": "application/json" },
                        body: JSON.stringify({ model: settings.aiModel, messages: [{ role: "user", content: promptText }] })
                    });
                    const data = await res.json();
                    if(data.error) return { error: data.error.message || "Unknown OpenRouter Error" };
                    return { text: data.choices?.[0]?.message?.content };
                } catch(e) { return { error: "Network Error." }; }
            };

            const testAIConnection = async () => {
                setAiTestResult("Testing connection...");
                const res = await askAI("Reply exactly with one word: SUCCESS");
                if (res.error) setAiTestResult(`❌ Error: ${res.error}`);
                else setAiTestResult(`✅ Connected successfully!`);
            };

            const runSmartSearch = async () => {
                if(!addState.query) return;
                haptic(); setAddState(p => ({...p, loading: true, results: []}));
                const res = await askAI(`Find exactly 5 movies/series related to: "${addState.query.replace(/"/g, "")}". If this is a fictional character's name, use the movie/show that character is from. If it's an actor or actress, use their well-known movies/shows. Reply ONLY in JSON format: [{"title":"Inception","type":"movie"}].`);
                if(res.text && !res.error) {
                    try {
                        const rawJson = res.text.replace(/```json/g, '').replace(/```/g, '').trim();
                        const items = JSON.parse(rawJson);
                        const fetches = items.map(i => fetch(`https://api.themoviedb.org/3/search/${i.type}?query=${encodeURIComponent(i.title)}&include_adult=${settings.adult}&language=${settings.language}`, { headers: { Authorization: `Bearer ${getTMDB()}` } }).then(r=>r.json()));
                        const results = await Promise.all(fetches);
                        let final = [];
                        results.forEach((r, idx) => {
                            const hit = r.results?.[0];
                            if(hit) { final.push({ id: `tmdb_${hit.id}`, aid: hit.id, type: items[idx].type, title: hit.title || hit.name, year: (hit.release_date || hit.first_air_date || '').split('-')[0], image: hit.poster_path ? `https://image.tmdb.org/t/p/w500${hit.poster_path}` : null }); }
                        });
                        setAddState(p => ({...p, loading: false, results: final}));
                    } catch(e) { setAddState(p => ({...p, loading: false})); showToast("AI Parse Error."); }
                } else { setAddState(p => ({...p, loading: false})); showToast(res.error || "AI Failed."); }
            };

            useEffect(() => {
                if (addState.tab !== 'search' || !debSearch.trim()) return; 
                if (searchCache.current[debSearch]) { setAddState(p => ({...p, loading: false, results: searchCache.current[debSearch]})); return; }
                let isMounted = true;
                
                const search = async () => {
                    setAddState(p => ({...p, loading: true}));
                    try {
                        let cleanQuery = debSearch.replace(/[()]/g, ' ');
                        const yrMatch = cleanQuery.match(/\b(19\d{2}|20\d{2})\b/);
                        let yearFilter = null;
                        if(yrMatch) {
                            yearFilter = yrMatch[0];
                            cleanQuery = cleanQuery.replace(yrMatch[0], '').trim();
                        }
                        if(!cleanQuery) cleanQuery = debSearch;

                        // TMDB (movies/tv/people), Jikan (anime), and AniList (anime) all run in parallel.
                        // Anime results are merged from both anime sources and deduped by MAL id — this
                        // widens coverage (a title one service misses, the other may have) and, just as
                        // importantly, spreads anime search load across two independently rate-limited
                        // services instead of leaning on Jikan alone for every keystroke.
                        const alVariables = { q: cleanQuery };
                        if (!settings.adult) alVariables.adult = false;
                        const alSearchQuery = `query ($q: String, $adult: Boolean) { Page(perPage: 6) { media(search: $q, type: ANIME, isAdult: $adult) { idMal title { romaji english } startDate { year } coverImage { large } } } }`;
                        const [d, janime, alRes] = await Promise.all([
                            fetch(`https://api.themoviedb.org/3/search/multi?query=${encodeURIComponent(cleanQuery)}&include_adult=${settings.adult}&language=${settings.language}`, { headers: { Authorization: `Bearer ${getTMDB()}` } }).then(r=>r.json()).catch(()=>({results:[]})),
                            fetch(`${settings.jikanUrl}/anime?q=${encodeURIComponent(cleanQuery)}&limit=6&sfw=${!settings.adult}`).then(r=>r.json()).catch(()=>({data:[]})),
                            fetch('https://graphql.anilist.co', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ query: alSearchQuery, variables: alVariables }) }).then(r=>r.json()).catch(()=>null)
                        ]);
                        if(!isMounted) return;
                        
                        let parsed = (d.results || []).filter(i => i.media_type === 'movie' || i.media_type === 'tv').map(i => ({
                            id: `tmdb_${i.id}`, aid: i.id, type: i.media_type, title: i.title || i.name, year: (i.release_date || i.first_air_date || '').split('-')[0], image: i.poster_path ? `https://image.tmdb.org/t/p/w500${i.poster_path}` : null
                        }));
                        const jikanAnimeResults = (janime.data || []).map(i => ({
                            id: `anime_${i.mal_id}`, aid: i.mal_id, type: 'anime', title: i.title || i.title_english,
                            year: i.year?.toString() || (i.aired?.from ? i.aired.from.split('-')[0] : ''),
                            image: i.images?.jpg?.large_image_url || null
                        }));
                        const seenMalIds = new Set(jikanAnimeResults.map(a => a.aid));
                        // Only keep AniList hits that carry a MAL id — the whole app keys anime by mal_id
                        // (vault, recommendations, bulk import), so an AniList-only title with no MAL match
                        // can't be safely stored or reopened later.
                        const anilistAnimeResults = (alRes?.data?.Page?.media || [])
                            .filter(m => m.idMal && !seenMalIds.has(m.idMal))
                            .map(m => ({ id: `anime_${m.idMal}`, aid: m.idMal, type: 'anime', title: m.title?.english || m.title?.romaji, year: m.startDate?.year?.toString() || '', image: m.coverImage?.large || null }));
                        const animeResults = [...jikanAnimeResults, ...anilistAnimeResults].slice(0, 8);
                        const people = (d.results || []).filter(i => i.media_type === 'person').slice(0, 3).map(i => ({
                            id: `person_${i.id}`, aid: i.id, type: 'person', title: i.name, image: i.profile_path ? `https://image.tmdb.org/t/p/w500${i.profile_path}` : null
                        }));
                        
                        // Smart Year Prioritization Match
                        if(yearFilter) {
                            parsed.sort((a,b) => {
                                if(a.year === yearFilter && b.year !== yearFilter) return -1;
                                if(b.year === yearFilter && a.year !== yearFilter) return 1;
                                return 0;
                            });
                        }
                        
                        parsed = parsed.slice(0, 10).concat(animeResults).concat(people);
                        searchCache.current[debSearch] = parsed;
                        setAddState(p => ({...p, results: parsed, loading: false}));
                    } catch(e) { if(isMounted) setAddState(p => ({...p, loading: false})); }
                };
                search();
                return () => { isMounted = false; };
            }, [debSearch, settings.adult, settings.language, addState.tab]);

            const processBulkImport = async () => {
                if(!bulkState.input.trim()) return;
                haptic();
                const titles = bulkState.input.split('\n').map(t=>t.trim()).filter(Boolean);
                // Deduplicate input lines
                const uniqueTitles = [...new Set(titles)];
                setBulkState(p => ({...p, loading: true, results: [], preview: true, progress: 0, total: uniqueTitles.length}));
                const results = [];
                const existingIds = new Set(vault.map(v => v.aid));

                for(let idx = 0; idx < uniqueTitles.length; idx++) {
                    const t = uniqueTitles[idx];
                    setBulkState(p => ({...p, progress: idx, currentTitle: t}));
                    try {
                        // Strip leading bullet/special chars
                        let cleanT = t.replace(/^[•·\-\*\>\#]+\s*/, '');
                        // Strip quality/format/release noise words
                        cleanT = cleanT.replace(/\b(3d|dolby|atmos|imax|hdr|hdr10|dv|bluray|blu-ray|bdrip|brrip|dvd|web-dl|webrip|hdtv|extended|theatrical|cut|remastered|remaster|proper|unrated|directors|director\'s|open.matte|dubbed|dub|hindi|english|tamil|telugu|multi|dual.audio|2nd.dub|netflix|amzn|amazon|season\s*\d+[-–]\d*|all.parts|all.seasons)\b/gi, ' ');
                        // Strip content in brackets/parens that look like format info
                        cleanT = cleanT.replace(/\[.*?\]/g, ' ').replace(/\((?!19\d{2}|20\d{2})[^)]*\)/g, ' ');
                        // Strip slashes (multi-title lines - take first title only)
                        if (cleanT.includes('/')) cleanT = cleanT.split('/')[0];
                        cleanT = cleanT.replace(/\s+/g, ' ').trim();
                        const yrMatch = cleanT.match(/\b(19\d{2}|20\d{2})\b/);
                        let yearFilter = null;
                        if(yrMatch) {
                            yearFilter = yrMatch[0];
                            cleanT = cleanT.replace(yrMatch[0], '').replace(/\s+/g, ' ').trim();
                        }
                        if(!cleanT) cleanT = t;

                        const d = await fetch(`https://api.themoviedb.org/3/search/multi?query=${encodeURIComponent(cleanT)}&include_adult=${settings.adult}&language=${settings.language}`, { headers: { Authorization: `Bearer ${getTMDB()}` } }).then(r=>r.json());
                        let validResults = d.results?.filter(i => i.media_type === 'movie' || i.media_type === 'tv') || [];
                        
                        // Smart title match: exact title match preferred
                        const titleLower = cleanT.toLowerCase();
                        const exactMatch = validResults.find(r => (r.title || r.name || '').toLowerCase() === titleLower);
                        if(exactMatch) validResults = [exactMatch, ...validResults.filter(r => r.id !== exactMatch.id)];

                        // Prioritize Year match
                        if(yearFilter) {
                            validResults.sort((a,b) => {
                                const aYear = (a.release_date || a.first_air_date || '').split('-')[0];
                                const bYear = (b.release_date || b.first_air_date || '').split('-')[0];
                                if(aYear === yearFilter && bYear !== yearFilter) return -1;
                                if(bYear === yearFilter && aYear !== yearFilter) return 1;
                                return 0;
                            });
                        }

                        const hit = validResults[0];
                        if(hit) {
                            const isDuplicate = existingIds.has(hit.id);
                            results.push({ 
                                success: !isDuplicate, 
                                duplicate: isDuplicate,
                                original: t, 
                                item: { id: `tmdb_${hit.id}`, aid: hit.id, type: hit.media_type, title: hit.title || hit.name, year: (hit.release_date || hit.first_air_date || '').split('-')[0], image: hit.poster_path ? `https://image.tmdb.org/t/p/w500${hit.poster_path}` : null }
                            });
                            // Add to existing set to prevent same-run dupes
                            existingIds.add(hit.id);
                        } else {
                            // TMDB has no movie/tv match — try Jikan before giving up, so anime titles
                            // pasted into bulk import actually land instead of always hitting "not found".
                            let animeHit = null;
                            try {
                                const janime = await fetch(`${settings.jikanUrl}/anime?q=${encodeURIComponent(cleanT)}&limit=1&sfw=${!settings.adult}`).then(r=>r.json());
                                animeHit = janime.data?.[0] || null;
                            } catch(e) {}
                            if (animeHit) {
                                const animeId = `anime_${animeHit.mal_id}`;
                                const isDuplicate = existingIds.has(animeHit.mal_id);
                                results.push({
                                    success: !isDuplicate,
                                    duplicate: isDuplicate,
                                    original: t,
                                    item: { id: animeId, aid: animeHit.mal_id, type: 'anime', title: animeHit.title || animeHit.title_english, year: animeHit.year?.toString() || (animeHit.aired?.from ? animeHit.aired.from.split('-')[0] : ''), image: animeHit.images?.jpg?.large_image_url || null }
                                });
                                existingIds.add(animeHit.mal_id);
                            } else {
                                results.push({ success: false, notFound: true, original: t });
                            }
                        }
                    } catch(e) { results.push({ success: false, original: t }); }
                }
                setBulkState(p => ({...p, loading: false, results, progress: uniqueTitles.length, currentTitle: ''}));
            };

            const commitBulkImport = () => {
                haptic();
                const newItems = bulkState.results.filter(r => r.success).map(r => ({ ...r.item, status: 'backlog', addedAt: Date.now(), soulRating: 0, customTags: [], personalNote: '' }));
                setVault(prev => {
                    const existingIds = new Set(prev.map(v => v.aid));
                    const uniqueNew = newItems.filter(item => !existingIds.has(item.aid));
                    return [...uniqueNew, ...prev];
                });
                showToast(`Imported ${newItems.length} items to Backlog.`);
                setAddState(p => ({...p, open: false}));
                setBulkState({ input: '', results: [], loading: false, preview: false });
            };

// Fast Fetch using Promise.all & Cache
            const fetchExplore = async (force = false) => {
                // FIX: this used to only check "do we have any data" — once true, it stayed true forever,
                // so a browser tab left open for weeks/months never refetched trending/genre rows.
                // Now it checks actual age against a 1hr TTL, same as the session cache.
                const isStale = Date.now() - lastExploreFetchRef.current > 3600000;
                if(!force && exploreData.trending.length > 0 && !isStale) return;
                setExploreLoading(true);
                try {
                    const traktHeaders = { 'Content-Type': 'application/json', 'trakt-api-version': '2', 'trakt-api-key': getTrakt() };
                    const lang = settings.language;
                    
                    const [traktMovies, traktShows, jikan, anilistTrending, tmdbTrendMovies, tmdbTrendTv] = await Promise.all([
                        fetch('https://api.trakt.tv/movies/trending?limit=10', { headers: traktHeaders }).then(r=>r.json()).catch(()=>[]),
                        fetch('https://api.trakt.tv/shows/trending?limit=10', { headers: traktHeaders }).then(r=>r.json()).catch(()=>[]),
                        fetch(`${settings.jikanUrl}/top/anime?filter=airing&limit=8`).then(r=>r.json()).catch(()=>({data:[]})),
                        fetch('https://graphql.anilist.co', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ query: `query { Page(perPage: 8) { media(type: ANIME, sort: TRENDING_DESC) { idMal title { romaji english } coverImage { large } bannerImage startDate { year } } } }` }) }).then(r=>r.json()).catch(()=>null),
                        fetch(`https://api.themoviedb.org/3/trending/movie/week?language=${lang}`, { headers: { Authorization: `Bearer ${getTMDB()}` } }).then(r=>r.json()).catch(()=>({results:[]})),
                        fetch(`https://api.themoviedb.org/3/trending/tv/week?language=${lang}`, { headers: { Authorization: `Bearer ${getTMDB()}` } }).then(r=>r.json()).catch(()=>({results:[]}))
                    ]);

                    const mapTraktToTMDB = async (items, type) => {
                        const fetches = items.map(i => {
                            const tmdbId = i[type === 'movie' ? 'movie' : 'show']?.ids?.tmdb;
                            if(!tmdbId) return null;
                            return fetch(`https://api.themoviedb.org/3/${type}/${tmdbId}?language=${lang}`, { headers: { Authorization: `Bearer ${getTMDB()}` } }).then(r=>r.json()).catch(()=>null);
                        });
                        const results = await Promise.all(fetches);
                        return results.filter(Boolean).map(i => ({
                            id: `${type}_${i.id}`, aid: i.id, type, title: i.title || i.name,
                            image: i.poster_path ? `https://image.tmdb.org/t/p/w500${i.poster_path}` : null,
                            backdrop: i.backdrop_path ? `https://image.tmdb.org/t/p/w780${i.backdrop_path}` : null,
                            year: (i.release_date || i.first_air_date || '').toString().split('-')[0]
                        }));
                    };

                    const [popMovies, popTv] = await Promise.all([ mapTraktToTMDB(traktMovies, 'movie'), mapTraktToTMDB(traktShows, 'tv') ]);

                    // Trakt's trending list requires a healthy Trakt key AND a follow-up TMDB call per item —
                    // two things that can fail. TMDB's own /trending endpoint needs neither: one call, full
                    // objects back directly. Merged in and deduped so the hero poster never comes back empty
                    // just because Trakt had a bad moment.
                    const mapTmdbTrending = (results, type) => (results || []).map(i => ({
                        id: `${type}_${i.id}`, aid: i.id, type, title: i.title || i.name,
                        image: i.poster_path ? `https://image.tmdb.org/t/p/w500${i.poster_path}` : null,
                        backdrop: i.backdrop_path ? `https://image.tmdb.org/t/p/w780${i.backdrop_path}` : null,
                        year: (i.release_date || i.first_air_date || '').toString().split('-')[0]
                    }));
                    const seenMovieIds = new Set(popMovies.map(m => m.aid));
                    const seenTvIds = new Set(popTv.map(t => t.aid));
                    const mergedMovies = [...popMovies, ...mapTmdbTrending(tmdbTrendMovies.results, 'movie').filter(m => !seenMovieIds.has(m.aid))];
                    const mergedTv = [...popTv, ...mapTmdbTrending(tmdbTrendTv.results, 'tv').filter(t => !seenTvIds.has(t.aid))];
                    
                    // Mixed sources again: Jikan's "top airing" list + AniList's trending list, merged and
                    // deduped by MAL id. AniList also supplies a real banner/backdrop image, which Jikan's
                    // top-anime endpoint doesn't — anime cards get a proper backdrop instead of none.
                    const jikanAnimeData = (jikan.data || []).map(i => ({ 
                        id: `anime_${i.mal_id}`, aid: i.mal_id, type: 'anime', title: i.title || i.title_english, 
                        image: i.images?.jpg?.large_image_url, backdrop: null, year: i.year?.toString() 
                    }));
                    const seenAnimeIds = new Set(jikanAnimeData.map(a => a.aid));
                    const anilistAnimeData = (anilistTrending?.data?.Page?.media || [])
                        .filter(m => m.idMal && !seenAnimeIds.has(m.idMal))
                        .map(m => ({ id: `anime_${m.idMal}`, aid: m.idMal, type: 'anime', title: m.title?.english || m.title?.romaji, image: m.coverImage?.large || null, backdrop: m.bannerImage || null, year: m.startDate?.year?.toString() || '' }));
                    const animeData = [...jikanAnimeData, ...anilistAnimeData].slice(0, 10);

                    const combinedTrending = [...mergedMovies, ...mergedTv].sort(() => 0.5 - Math.random()).slice(0, 10);

                    // FIX #31: Do NOT store React components (<Icon...>) in state/cache. Store identifying strings.
                    const extraGenres = [
                        { id: 9648, name: "Mystery Mindbenders", type: "movie", iconName: "Search", iconColor: "text-yellow-500" },
                        { id: 27, name: "Horror Nights", type: "movie", iconName: "Play", iconColor: "text-red-600" },
                        { id: 878, name: "Sci-Fi Dimensions", type: "movie", iconName: "Sparkles", iconColor: "text-blue-400" },
                        { id: 14, name: "Fantasy Worlds", type: "movie", iconName: "Collection", iconColor: "text-purple-400" },
                        { id: 10751, name: "Kids & Family", type: "movie", iconName: "Plus", iconColor: "text-green-400" },
                        { id: 99, name: "Documentaries", type: "movie", iconName: "List", iconColor: "text-gray-400" }
                    ];

                    let allExtras = [...extraGenres];
                    if (settings.adult) { allExtras.push({ id: 10749, special: "adult", name: "Adult / Steamy", type: "movie", iconName: "Sparkles", iconColor: "text-pink-500" }); }

                    const rawExtras = await Promise.all(allExtras.map(cat => {
                        let url = `https://api.themoviedb.org/3/discover/${cat.type}?include_adult=${settings.adult}&language=${lang}&sort_by=popularity.desc`;
                        if (cat.special === "adult") { url += `&with_genres=10749&certification_country=${settings.region}&certification=NC-17`; } 
                        else { url += `&with_genres=${cat.id}`; }
                        return fetch(url, { headers: { Authorization: `Bearer ${getTMDB()}` } }).then(r=>r.json()).catch(()=>({results:[]}));
                    }));

                    const extraSections = rawExtras.map((d, i) => ({
                        id: allExtras[i].id, title: allExtras[i].name, type: allExtras[i].type, 
                        iconName: allExtras[i].iconName, iconColor: allExtras[i].iconColor,
                        items: (d.results||[]).filter(x => x.poster_path).slice(0,10).map(x => ({
                             id: `${allExtras[i].type}_${x.id}`, aid: x.id, type: allExtras[i].type, title: x.title || x.name,
                             image: `https://image.tmdb.org/t/p/w500${x.poster_path}`, year: (x.release_date || x.first_air_date || '').toString().split('-')[0]
                        }))
                    }));

                    const finalData = { trending: combinedTrending.slice(0, 5), anime: animeData, popMovies: mergedMovies, popTv: mergedTv, extras: extraSections };
                    setExploreData(finalData);
                    lastExploreFetchRef.current = Date.now();
                    sessionStorage.setItem('omni16_explore_cache', JSON.stringify({ ts: Date.now(), data: finalData }));
                } catch(e) { console.error("Explore Fetch Error", e); }
                setExploreLoading(false);
            };

            useEffect(() => { if(activeNav === 'explore') fetchExplore(); }, [activeNav, settings.adult, settings.language, settings.region]);

            // Hero carousel: snap back to slide 0 whenever the trending set changes, and auto-advance.
            useEffect(() => { setHeroIndex(0); }, [exploreData.trending]);
            useEffect(() => {
                if (exploreData.trending.length < 2) return;
                const t = setInterval(() => setHeroIndex(i => (i + 1) % exploreData.trending.length), 6000);
                return () => clearInterval(t);
            }, [exploreData.trending.length]);

            const onHeroTouchStart = (e) => { heroStartX.current = e.touches[0].clientX; heroStartY.current = e.touches[0].clientY; heroDragging.current = true; heroMoved.current = false; };
            const onHeroTouchMove = (e) => {
                if (!heroDragging.current) return;
                const dx = e.touches[0].clientX - heroStartX.current;
                const dy = e.touches[0].clientY - heroStartY.current;
                if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) { heroMoved.current = true; setHeroOffset(dx); }
            };
            const onHeroTouchEnd = () => {
                if (Math.abs(heroOffset) > 60 && exploreData.trending.length > 1) {
                    haptic();
                    const dir = heroOffset < 0 ? 1 : -1;
                    setHeroIndex(i => (i + dir + exploreData.trending.length) % exploreData.trending.length);
                }
                setHeroOffset(0);
                heroDragging.current = false;
            };

            const syncUpdate = (id, updates) => {
                setVault(prev => prev.map(v => v.id === id ? { ...v, ...updates } : v));
                setViewingItem(prev => prev && prev.id === id ? {...prev, ...updates} : prev);
            };

            const deleteItem = (id) => {
                setVault(prev => prev.filter(v => v.id !== id));
                setPlaylists(prev => prev.map(pl => ({ ...pl, itemIds: pl.itemIds.filter(i => i !== id) })));
                if(viewingItem?.id === id) setViewingItem(null);
                showToast("Item deleted from Vault.");
            };

            const addToVaultFast = (rawItem) => {
                haptic();
                let target = vault.find(v => v.aid === rawItem.aid && v.type === rawItem.type);
                if (!target) {
                    const newItem = { ...rawItem, id: `tmdb_${rawItem.aid}`, status: 'backlog', addedAt: Date.now(), soulRating: 0, customTags: [], personalNote: '' };
                    setVault(prev => [newItem, ...prev]);
                    showToast("Added to Vault Backlog");
                } else { showToast("Already in Vault"); }
            };

            const interactWithTempItem = (updates) => {
                haptic();
                if (viewingItem.status === 'none') {
                    const newItem = { ...viewingItem, status: 'backlog', addedAt: Date.now(), soulRating: 0, customTags: [], personalNote: '', ...updates };
                    setVault(prev => { if(prev.some(v => v.aid === newItem.aid)) return prev; return [newItem, ...prev]; });
                    setViewingItem(newItem);
                    showToast("Added to Vault");
                } else {
                    const finalUpdates = updates.status === 'completed' ? { ...updates, completedAt: Date.now() } : updates;
                    syncUpdate(viewingItem.id, finalUpdates);
                }
            };

            const openDetail = async (rawItem) => {
                haptic();
                let target = vault.find(v => v.aid === rawItem.aid && v.type === rawItem.type);
                if (!target) { target = { ...rawItem, id: `tmp_${rawItem.aid}`, status: 'none', customTags: [], personalNote: '' }; }
                
                setViewingItem(target); 
                setActiveTrailer(null); 
                setInlineActionTab(null);
                setAddState(p => ({...p, open: false}));

                if(!target.desc || !target.cast || !target.recommendations || target.isMature === undefined) {
                    try {
                        let u = {};
                        // FIX: anime must be checked FIRST — it used to fall into the TMDB branch below
                        // (mal_id was being sent to TMDB as if it were a tv id, returning wrong/unrelated data).
                        if(target.type === 'anime') {
                            // MIXED SOURCE STRATEGY:
                            // AniList's GraphQL can return detail + cast/VAs + recommendations + reviews +
                            // studio + banner art in ONE request (it supports looking up by MAL id directly,
                            // so our existing aid=mal_id scheme needs no change). That single call replaces
                            // what used to be 3-4 separate Jikan REST calls. Jikan is kept for its screenshot
                            // gallery (AniList has no equivalent) and as a full fallback if AniList has no
                            // record for this title or is unreachable — so one service being down never
                            // breaks the page, it just quietly falls back to the other.
                            let anilistOk = false;
                            try {
                                const alQuery = `query ($idMal: Int) { Media(idMal: $idMal, type: ANIME) { idMal genres averageScore popularity isAdult bannerImage description(asHtml: false) studios(isMain: true) { nodes { name } } trailer { id site } characters(sort: ROLE, perPage: 10) { edges { node { id name { full } image { large } } voiceActors(language: JAPANESE) { id name { full } image { large } } } } recommendations(sort: RATING_DESC, perPage: 10) { nodes { mediaRecommendation { idMal title { romaji english } coverImage { large } } } } reviews(sort: RATING_DESC, perPage: 5) { nodes { summary body(asHtml: false) score user { name avatar { medium } } } } } }`;
                                const [alRes, picsRes, charsRes] = await Promise.all([
                                    fetch('https://graphql.anilist.co', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ query: alQuery, variables: { idMal: target.aid } }) }).then(r=>r.json()),
                                    fetch(`${settings.jikanUrl}/anime/${target.aid}/pictures`).then(r=>r.json()).catch(()=>({data:[]})),
                                    fetch(`${settings.jikanUrl}/anime/${target.aid}/characters`).then(r=>r.json()).catch(()=>({data:[]}))
                                ]);
                                const m = alRes?.data?.Media;
                                if (!m) throw new Error("AniList has no record for this MAL id");
                                anilistOk = true;

                                const anilistCast = (m.characters?.edges || []).map(e => {
                                    const va = e.voiceActors?.[0];
                                    return { id: va?.id || e.node?.id, name: va?.name?.full || e.node?.name?.full, role: e.node?.name?.full, image: va?.image?.large || e.node?.image?.large || null, source: 'anilist' };
                                });
                                const jikanCast = (charsRes.data || []).slice(0, 10).map(c => {
                                    const va = (c.voice_actors || []).find(v => v.language === 'Japanese') || c.voice_actors?.[0];
                                    return { id: va?.person?.mal_id || c.character?.mal_id, name: va?.person?.name || c.character?.name, role: c.character?.name, image: va?.person?.images?.jpg?.image_url || c.character?.images?.jpg?.image_url || null, source: 'jikan' };
                                });
                                const jikanPics = (picsRes.data || []).slice(0, 8).map(p => p.jpg?.large_image_url || p.jpg?.image_url).filter(Boolean);

                                u = {
                                    desc: (m.description || '').replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, ''),
                                    genres: m.genres || [],
                                    mediaVideos: (m.trailer?.id && m.trailer.site === 'youtube') ? [{ key: m.trailer.id, name: 'Trailer' }] : [],
                                    mediaImages: [m.bannerImage, ...jikanPics].filter(Boolean),
                                    certification: m.isAdult ? '18+' : '', isMature: !!m.isAdult,
                                    rating: m.averageScore ? (m.averageScore / 10).toFixed(1) : null, voteCount: m.popularity || 0, ratingSource: 'AniList',
                                    director: (m.studios?.nodes || []).map(s => s.name).join(', '), directorLabel: 'Studio',
                                    // Prefer AniList's cast (usually richer VA images); fall back to Jikan's if AniList came back thin.
                                    cast: anilistCast.length > 0 ? anilistCast.slice(0, 10) : jikanCast,
                                    recommendations: (m.recommendations?.nodes || []).filter(r => r.mediaRecommendation?.idMal).slice(0, 10).map(r => ({
                                        id: `anime_${r.mediaRecommendation.idMal}`, aid: r.mediaRecommendation.idMal, type: 'anime', title: r.mediaRecommendation.title?.english || r.mediaRecommendation.title?.romaji, image: r.mediaRecommendation.coverImage?.large
                                    })),
                                    reviews: (m.reviews?.nodes || []).slice(0, 5).map(r => ({
                                        author: r.user?.name || 'AniList User', rating: r.score || null, content: r.body || r.summary, avatar: r.user?.avatar?.medium || null
                                    }))
                                };
                            } catch(e) { console.log("AniList primary fetch failed — falling back to Jikan-only:", e); }

                            if (!anilistOk) {
                                const [d, recs, charsRes, picsRes, revRes] = await Promise.all([
                                    fetch(`${settings.jikanUrl}/anime/${target.aid}/full`).then(r=>r.json()),
                                    fetch(`${settings.jikanUrl}/anime/${target.aid}/recommendations`).then(r=>r.json()).catch(()=>({data:[]})),
                                    fetch(`${settings.jikanUrl}/anime/${target.aid}/characters`).then(r=>r.json()).catch(()=>({data:[]})),
                                    fetch(`${settings.jikanUrl}/anime/${target.aid}/pictures`).then(r=>r.json()).catch(()=>({data:[]})),
                                    fetch(`${settings.jikanUrl}/anime/${target.aid}/reviews`).then(r=>r.json()).catch(()=>({data:[]}))
                                ]);
                                const rawRating = d.data?.rating || '';
                                const certification = rawRating.split(' - ')[0].trim();
                                const isMature = /^(R|R\+|Rx)/i.test(certification);
                                u = { 
                                    desc: d.data?.synopsis, genres: d.data?.genres?.map(g => g.name) || [], 
                                    mediaVideos: d.data?.trailer?.youtube_id ? [{ key: d.data.trailer.youtube_id, name: 'Trailer' }] : [],
                                    mediaImages: (picsRes.data || []).slice(0, 8).map(p => p.jpg?.large_image_url || p.jpg?.image_url).filter(Boolean),
                                    certification, isMature,
                                    rating: d.data?.score || null, voteCount: d.data?.scored_by || 0, ratingSource: 'MAL',
                                    director: (d.data?.studios || []).map(s => s.name).join(', '), directorLabel: 'Studio',
                                    cast: (charsRes.data || []).slice(0, 10).map(c => {
                                        const va = (c.voice_actors || []).find(v => v.language === 'Japanese') || c.voice_actors?.[0];
                                        return {
                                            id: va?.person?.mal_id || c.character?.mal_id, name: va?.person?.name || c.character?.name,
                                            role: c.character?.name, image: va?.person?.images?.jpg?.image_url || c.character?.images?.jpg?.image_url || null,
                                            source: 'jikan'
                                        };
                                    }),
                                    recommendations: (recs.data || []).slice(0,10).map(r => ({
                                        id: `anime_${r.entry.mal_id}`, aid: r.entry.mal_id, type: 'anime', title: r.entry.title, image: r.entry.images?.jpg?.large_image_url
                                    })),
                                    reviews: (revRes.data || []).slice(0, 5).map(r => ({
                                        author: r.user?.username || 'MAL User', rating: r.score || null, content: r.review, avatar: r.user?.images?.jpg?.image_url || null
                                    }))
                                };
                            }
                        } else if(target.type === 'movie' || target.type === 'tv') {
                            const ratingAppend = target.type === 'movie' ? 'release_dates' : 'content_ratings';
                            const d = await fetch(`https://api.themoviedb.org/3/${target.type}/${target.aid}?append_to_response=videos,images,credits,watch/providers,recommendations,reviews,external_ids,${ratingAppend}&language=${settings.language}`, { headers: { Authorization: `Bearer ${getTMDB()}` } }).then(r=>r.json());
                            if (d.success === false) throw new Error("TMDB blocked.");

                            const providers = d['watch/providers']?.results?.[settings.region] || d['watch/providers']?.results?.US || {};
                            let certification = '';
                            if (target.type === 'movie') {
                                const rel = d.release_dates?.results?.find(r => r.iso_3166_1 === settings.region) || d.release_dates?.results?.find(r => r.iso_3166_1 === 'US');
                                certification = (rel?.release_dates || []).find(x => x.certification)?.certification || '';
                            } else {
                                const cr = d.content_ratings?.results?.find(r => r.iso_3166_1 === settings.region) || d.content_ratings?.results?.find(r => r.iso_3166_1 === 'US');
                                certification = cr?.rating || '';
                            }
                            const isMature = d.adult === true || ['R','NC-17','NC17','18','TV-MA'].includes(certification.toUpperCase());
                            const director = target.type === 'movie'
                                ? (d.credits?.crew || []).filter(c => c.job === 'Director').map(c => c.name).join(', ')
                                : (d.created_by || []).map(c => c.name).join(', ');
                            u = {
                                desc: d.overview, genres: d.genres?.map(g => g.name) || [], spokenLanguages: (d.spoken_languages || []).map(l => l.english_name || l.name).filter(Boolean), 
                                runtime: d.runtime || (d.episode_run_time?.[0]) || 45,
                                certification, isMature,
                                rating: d.vote_average ? d.vote_average.toFixed(1) : null, voteCount: d.vote_count || 0, ratingSource: 'TMDB',
                                imdbId: d.imdb_id || d.external_ids?.imdb_id || null,
                                director, directorLabel: target.type === 'movie' ? 'Director' : 'Creator',
                                cast: (d.credits?.cast || []).slice(0, 10).map(c => ({ id: c.id, name: c.name, role: c.character, image: c.profile_path ? `https://image.tmdb.org/t/p/w200${c.profile_path}` : null })),
                                mediaImages: (d.images?.backdrops || []).slice(0, 8).map(i => `https://image.tmdb.org/t/p/w780${i.file_path}`),
                                mediaVideos: (d.videos?.results || []).filter(v => v.site === 'YouTube' && v.type !== 'Featurette').slice(0, 6),
                                reviews: (d.reviews?.results || []).slice(0, 5).map(r => ({
                                    author: r.author, rating: r.author_details?.rating || null, content: r.content,
                                    avatar: r.author_details?.avatar_path ? (r.author_details.avatar_path.startsWith('/http') ? r.author_details.avatar_path.slice(1) : `https://image.tmdb.org/t/p/w100${r.author_details.avatar_path}`) : null
                                })),
                                stream: providers.flatrate || [], rent: providers.rent || [],
                                seasons: (target.type === 'tv') ? (d.seasons || []).filter(s => s.season_number > 0).map(s => ({ id: s.id, number: s.season_number, name: s.name, episodeCount: s.episode_count, airDate: s.air_date, image: s.poster_path ? `https://image.tmdb.org/t/p/w300${s.poster_path}` : null })) : [],
                                recommendations: (d.recommendations?.results || []).filter(r => r.poster_path).slice(0, 12).map(r => ({
                                    id: `tmdb_${r.id}`, aid: r.id, type: r.media_type === 'movie' ? 'movie' : target.type, title: r.title || r.name, image: `https://image.tmdb.org/t/p/w500${r.poster_path}`, year: (r.release_date || r.first_air_date || '').toString().split('-')[0]
                                }))
                            };
                        }
                        if (target.status !== 'none') { syncUpdate(target.id, u); } else { setViewingItem(p => ({...p, ...u})); }

                        // JustWatch + Watchmode now run CONCURRENTLY (Promise.all) instead of one-after-another.
                        // This was a real, measurable slowdown before: every detail open waited for JustWatch
                        // to finish before Watchmode even started.
                        const fetchJustWatch = async () => {
                            try {
                                const jwTitle = target.title;
                                const jwType = (target.type === 'movie') ? 'MOVIE' : 'SHOW';
                                const jwBody = JSON.stringify({
                                    operationName: "GetSuggestedTitles",
                                    variables: { country: "IN", language: "en", first: 5, filter: { searchQuery: jwTitle, objectTypes: [jwType] } },
                                    query: `query GetSuggestedTitles($country: Country!, $language: Language!, $first: Int!, $filter: TitleFilter) { popularTitles(country: $country, first: $first, filter: $filter) { edges { node { content(country: $country, language: $language) { title fullPath } offers(country: $country, platform: WEB) { monetizationType retailPrice(language: $language) package { packageId clearName iconUrl } } } } } }`
                                });
                                const jwRes = await fetch('https://yellow-meadow-06cc.ggam1097.workers.dev', {
                                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: jwBody
                                });
                                const jwData = await jwRes.json();
                                const edges = jwData?.data?.popularTitles?.edges || [];
                                if (edges.length > 0) {
                                    const offers = edges[0].node?.offers || [];
                                    const seen = new Set();
                                    const jwProviders = offers.filter(o => { const id = o.package?.packageId; if (!id || seen.has(id)) return false; seen.add(id); return true; }).map(o => ({
                                        packageId: o.package.packageId,
                                        name: o.package.clearName,
                                        iconUrl: o.package.iconUrl ? `https://images.justwatch.com${o.package.iconUrl.replace('{profile}','s100')}` : null,
                                        type: o.monetizationType,
                                        price: o.retailPrice || ''
                                    }));
                                    const jwUpdate = { jwProviders };
                                    if (target.status !== 'none') { syncUpdate(target.id, jwUpdate); } else { setViewingItem(p => ({...p, ...jwUpdate})); }
                                }
                            } catch(e) { console.log("JustWatch fetch failed", e); }
                        };

                        const fetchWatchmodeSources = async () => {
                            try {
                                const wmType = (target.type === 'movie') ? 'movie' : 'tv_series';
                                const wmSearch = await fetch(`https://api.watchmode.com/v1/search/?apiKey=${WATCHMODE_KEY}&search_field=name&search_value=${encodeURIComponent(target.title)}&types=${wmType}`).then(r=>r.json());
                                const wmId = wmSearch?.title_results?.[0]?.id;
                                if (wmId) {
                                    const wmSources = await fetch(`https://api.watchmode.com/v1/title/${wmId}/sources/?apiKey=${WATCHMODE_KEY}&regions=IN`).then(r=>r.json());
                                    if (Array.isArray(wmSources) && wmSources.length > 0) {
                                        const seen = new Set();
                                        const wmProviders = wmSources.filter(s => { if(seen.has(s.source_id)) return false; seen.add(s.source_id); return true; }).map(s => ({
                                            packageId: `wm_${s.source_id}`,
                                            name: s.name,
                                            iconUrl: null,
                                            type: s.type === 'sub' ? 'FLATRATE' : s.type === 'free' ? 'FREE' : s.type === 'rent' ? 'RENT' : s.type === 'buy' ? 'BUY' : s.type.toUpperCase(),
                                            price: s.price ? `₹${s.price}` : '',
                                            webUrl: s.web_url || ''
                                        }));
                                        // Merge: only add WM providers not already in JW list
                                        const wmUpdate = (prev) => {
                                            const existing = prev.jwProviders || [];
                                            const existingNames = new Set(existing.map(p => p.name.toLowerCase()));
                                            const newOnes = wmProviders.filter(p => !existingNames.has(p.name.toLowerCase()));
                                            return { jwProviders: [...existing, ...newOnes] };
                                        };
                                        if (target.status !== 'none') { syncUpdate(target.id, wmUpdate(target)); } else { setViewingItem(p => ({...p, ...wmUpdate(p)})); }
                                    }
                                }
                            } catch(e) { console.log("Watchmode fetch failed", e); }
                        };

                        // True IMDb rating requires an OMDb key (free at omdbapi.com/apikey.aspx) — without one,
                        // no IMDb number is shown or faked; the TMDB rating set above is the only score displayed.
                        const fetchImdbRating = async () => {
                            if ((target.type !== 'movie' && target.type !== 'tv') || !settings.omdbKey?.trim() || !u.imdbId) return;
                            try {
                                const om = await fetch(`https://www.omdbapi.com/?i=${u.imdbId}&apikey=${settings.omdbKey.trim()}`).then(r=>r.json());
                                if (om.Response === 'True' && om.imdbRating && om.imdbRating !== 'N/A') {
                                    const imdbUpdate = { imdbRating: om.imdbRating, imdbVotes: om.imdbVotes };
                                    if (target.status !== 'none') { syncUpdate(target.id, imdbUpdate); } else { setViewingItem(p => ({...p, ...imdbUpdate})); }
                                }
                            } catch(e) { console.log("OMDb fetch failed", e); }
                        };

                        await Promise.all([fetchJustWatch(), fetchWatchmodeSources(), fetchImdbRating()]);

                    } catch(e) {}
                }
            };

            const fetchActor = async (actor) => {
                haptic(); 
                setActorProfile({ loading: true, ...actor });
                try {
                    if (actor.source === 'anilist') {
                        // Anime voice actor sourced from AniList — AniList calls these "Staff", a different
                        // id namespace again (neither MAL person id nor TMDB person id).
                        const query = `query ($id: Int) { Staff(id: $id) { name { full } image { large } description(asHtml: false) characterMedia(sort: POPULARITY_DESC, perPage: 9) { edges { node { idMal title { romaji english } coverImage { large } } } } } }`;
                        const d = await fetch('https://graphql.anilist.co', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ query, variables: { id: actor.id } }) }).then(r=>r.json());
                        const s = d?.data?.Staff;
                        if (!s) throw new Error("Missing AniList staff data");
                        const knownFor = (s.characterMedia?.edges || []).filter(e => e.node?.idMal).map(e => ({ aid: e.node.idMal, type: 'anime', title: e.node.title?.english || e.node.title?.romaji, image: e.node.coverImage?.large }));
                        setActorProfile(p => ({ ...p, loading: false, bio: (s.description || 'No biography available.').replace(/<[^>]+>/g, ''), knownFor }));
                    } else if (actor.source === 'jikan') {
                        // Anime voice actor — different API, different id namespace (MAL, not TMDB)
                        const d = await fetch(`${settings.jikanUrl}/people/${actor.id}/full`).then(r=>r.json());
                        if (!d.data) throw new Error("Missing VA data");
                        const knownFor = (d.data.voices || []).slice(0, 9).map(v => ({ aid: v.anime?.mal_id, type: 'anime', title: v.anime?.title, image: v.anime?.images?.jpg?.image_url }));
                        setActorProfile(p => ({ ...p, loading: false, bio: d.data.about || 'No biography available.', knownFor }));
                    } else {
                        const d = await fetch(`https://api.themoviedb.org/3/person/${actor.id}?append_to_response=combined_credits&language=${settings.language}`, { headers: { Authorization: `Bearer ${getTMDB()}` } }).then(r=>r.json());
                        if (d.success === false) throw new Error("Missing actor data");
                        const knownFor = (d.combined_credits?.cast || []).sort((a,b) => b.popularity - a.popularity).slice(0, 9).map(i => ({ aid: i.id, type: i.media_type, title: i.title || i.name, image: i.poster_path ? `https://image.tmdb.org/t/p/w200${i.poster_path}` : null }));
                        setActorProfile(p => ({ ...p, loading: false, bio: d.biography, knownFor }));
                    }
                } catch(e) { setActorProfile(null); showToast("Failed to load profile."); }
            };

            const openAnimeGrid = async () => {
                haptic(); setViewingItem(null);
                setActiveGrid({ title: 'Top Anime', loading: true, items: [] });
                try {
                    const [jikanRes, alRes] = await Promise.all([
                        fetch(`${settings.jikanUrl}/top/anime?limit=25`).then(r=>r.json()).catch(()=>({data:[]})),
                        fetch('https://graphql.anilist.co', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ query: `query { Page(perPage: 25) { media(type: ANIME, sort: SCORE_DESC) { idMal title { romaji english } coverImage { large } startDate { year } } } }` }) }).then(r=>r.json()).catch(()=>null)
                    ]);
                    const jikanItems = (jikanRes.data || []).map(i => ({
                        id: `anime_${i.mal_id}`, aid: i.mal_id, type: 'anime', title: i.title || i.title_english,
                        year: i.year?.toString() || (i.aired?.from ? i.aired.from.split('-')[0] : ''),
                        image: i.images?.jpg?.large_image_url || null
                    }));
                    // Same merge-and-dedupe pattern used everywhere else anime is mixed: widen the list
                    // with AniList's top-scored titles the Jikan list didn't already have.
                    const seenIds = new Set(jikanItems.map(a => a.aid));
                    const anilistItems = (alRes?.data?.Page?.media || [])
                        .filter(m => m.idMal && !seenIds.has(m.idMal))
                        .map(m => ({ id: `anime_${m.idMal}`, aid: m.idMal, type: 'anime', title: m.title?.english || m.title?.romaji, year: m.startDate?.year?.toString() || '', image: m.coverImage?.large || null }));
                    setActiveGrid({ title: 'Top Anime', loading: false, items: [...jikanItems, ...anilistItems] });
                } catch (e) { setActiveGrid({ title: 'Top Anime', loading: false, items: [], error: true }); }
            };

            const openGenreGrid = async (genreName, genreId = null, mediaType = 'movie') => {
                haptic(); setViewingItem(null);
                const id = genreId || GENRE_MAP[genreName] || GENRE_MAP["Action"];
                setActiveGrid({ title: `${genreName}`, loading: true, items: [] });
                try {
                    let url = `https://api.themoviedb.org/3/discover/${mediaType}?with_genres=${id}&include_adult=${settings.adult}&language=${settings.language}&sort_by=popularity.desc`;
                    if (id === 10749 && settings.adult && genreName.includes("Adult")) {
                        url = `https://api.themoviedb.org/3/discover/movie?with_genres=10749&certification_country=${settings.region}&certification=NC-17&sort_by=popularity.desc`;
                    }
                    const d = await fetch(url, { headers: { Authorization: `Bearer ${getTMDB()}` } }).then(r=>r.json());
                    const items = (d.results||[]).filter(i => i.poster_path).map(i => ({
                        id: `${mediaType}_${i.id}`, aid: i.id, type: mediaType, title: i.title || i.name, year: (i.release_date || i.first_air_date || '').split('-')[0], image: i.poster_path ? `https://image.tmdb.org/t/p/w500${i.poster_path}` : null
                    }));
                    setActiveGrid({ title: `${genreName}`, loading: false, items });
                } catch (e) { setActiveGrid({ title: genreName, loading: false, items: [], error: true }); }
            };

            const filteredVault = useMemo(() => {
                const rawQuery = internalQuery.trim();
                const tokens = rawQuery ? rawQuery.split(/\s+/) : [];
                const hashTokens = tokens.filter(t => t.startsWith('#') && t.length > 1).map(t => t.slice(1).toLowerCase());
                const textQuery = tokens.filter(t => !t.startsWith('#')).join(' ').toLowerCase();

                let filtered = vault.filter(v => {
                    if (filterStatus !== 'all' && v.status !== filterStatus) return false;
                    if (globalTagFilters.length > 0 && !globalTagFilters.every(tag => matchItemTag(v, tag))) return false;
                    if (hashTokens.length > 0) {
                        const genresLower = (v.genres || []).map(g => g.toLowerCase());
                        const customLower = (v.customTags || []).map(g => g.toLowerCase());
                        const hashOk = hashTokens.every(h => genresLower.some(g => g.includes(h)) || customLower.some(g => g.includes(h)) || (h === '18+' && v.isMature));
                        if (!hashOk) return false;
                    }
                    if (textQuery) {
                        const inTitle = v.title.toLowerCase().includes(textQuery);
                        const inCast = (v.cast || []).some(c => c.name?.toLowerCase().includes(textQuery));
                        if (!inTitle && !inCast) return false;
                    }
                    return true;
                });
                if (vaultSort === 'title') filtered = filtered.sort((a,b) => a.title.localeCompare(b.title));
                else if (vaultSort === 'year') filtered = filtered.sort((a,b) => (b.year||0) - (a.year||0));
                else if (vaultSort === 'rating') filtered = filtered.sort((a,b) => (b.soulRating||0) - (a.soulRating||0));
                else filtered = filtered.sort((a,b) => b.addedAt - a.addedAt);
                return filtered;
            }, [vault, filterStatus, internalQuery, globalTagFilters, vaultSort]);

            // Real co-occurrence, computed from the actual vault — not a hardcoded suggestion list.
            const relatedTags = useMemo(() => {
                if (globalTagFilters.length === 0) return [];
                const matching = vault.filter(v => globalTagFilters.every(tag => matchItemTag(v, tag)));
                const freq = {};
                matching.forEach(v => {
                    SMART_TAG_CATALOG.forEach(tag => { if (!globalTagFilters.includes(tag) && matchItemTag(v, tag)) freq[tag] = (freq[tag]||0) + 1; });
                    (v.customTags || []).forEach(ct => { if (!globalTagFilters.includes(ct)) freq[ct] = (freq[ct]||0) + 1; });
                });
                return Object.entries(freq).sort((a,b) => b[1]-a[1]).slice(0, 8).map(([tag]) => tag);
            }, [vault, globalTagFilters]);

            const toggleTagFilter = (tag) => { haptic(); setGlobalTagFilters(prev => prev.includes(tag) ? prev.filter(t => t !== tag) : [...prev, tag]); };

            const stats = useMemo(() => {
                const completed = vault.filter(v => v.status === 'completed');
                let eps = 0, mins = 0; let genreCount = {};
                completed.forEach(v => {
                    if (v.type === 'tv' || v.type === 'anime') {
                        // Use real episode count from seasons if available, else fall back to 12 avg
                        const totalEps = v.seasons ? v.seasons.reduce((sum, s) => sum + (s.episodeCount || 0), 0) : 12;
                        eps += totalEps;
                        mins += totalEps * (v.runtime || 40);
                    } else {
                        eps += 1;
                        mins += (v.runtime || 110);
                    }
                    (v.genres || []).forEach(g => { genreCount[g] = (genreCount[g] || 0) + 1; });
                });
                const topGenres = Object.entries(genreCount).sort((a,b) => b[1] - a[1]).slice(0,5);
                // Completed date log
                const recentlyCompleted = vault.filter(v => v.status === 'completed' && v.completedAt).sort((a,b) => b.completedAt - a.completedAt).slice(0, 5);
                return { total: vault.length, comp: completed.length, eps, days: (mins/60/24).toFixed(1), topGenres, recentlyCompleted };
            }, [vault]);

            const renderCardList = (items) => (
                <div className="flex overflow-x-auto space-x-4 hide-scrollbar px-6 -mx-6 pb-4">
                    {items.map((item, idx) => (
                        <div key={idx} onClick={() => openDetail(item)} className="w-[120px] flex-shrink-0 cursor-pointer bouncy-tap animate-spring-pop" style={{animationDelay: `${idx * 0.05}s`}}>
                            <div className="h-[180px] bg-gray-200 dark:bg-[#1C1C1E] rounded-[1.5rem] overflow-hidden mb-2 shadow-sm border border-black/5 dark:border-white/5 relative">
                                {item.image ? <img src={item.image} loading="lazy" className="w-full h-full object-cover transition-transform duration-500 hover:scale-110"/> : <div className="w-full h-full flex justify-center items-center"><Icon.Film s={32} c="text-gray-400"/></div>}
                            </div>
                            <p className="text-[11px] font-bold truncate text-center">{item.title}</p>
                        </div>
                    ))}
                </div>
            );

            const renderSafeModal = () => {
                if (!viewingItem) return null;
                const safeCast = viewingItem.cast || [];
                const safeVideos = viewingItem.mediaVideos || [];
                const safeImages = viewingItem.mediaImages || [];
                const safeStream = viewingItem.stream || [];
                const safeGenres = viewingItem.genres || [];
                const safeLanguages = viewingItem.spokenLanguages || [];
                const safeCustomTags = viewingItem.customTags || [];
                const safeCustomSources = settings.customSources || []; 
                const safeRecs = viewingItem.recommendations || [];
                const safeJWProviders = viewingItem.jwProviders || [];
                const safeReviews = viewingItem.reviews || [];

                return (
                    <div className="flex-1 overflow-y-auto hide-scrollbar pb-32 relative bg-[#F2F2F7] dark:bg-[#0A0A0C]">
                        <div className="relative w-full h-[40vh] flex-shrink-0 bg-black">
                            {activeTrailer ? (
                                <>
                                    <iframe className="w-full h-full animate-spring-pop" src={`https://www.youtube.com/embed/${activeTrailer}?autoplay=1&playsinline=1&rel=0`} frameBorder="0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowFullScreen></iframe>
                                    <a href={`https://www.youtube.com/watch?v=${activeTrailer}`} target="_blank" onClick={haptic} className="absolute bottom-3 right-3 z-40 bg-black/60 backdrop-blur-xl text-white text-[10px] font-bold px-3 py-2 rounded-xl border border-white/10 bouncy-tap">Not playing? Open in YouTube</a>
                                </>
                            ) : (
                                <>
                                    {(viewingItem.backdrop || viewingItem.image) && <img src={viewingItem.backdrop || viewingItem.image} className="w-full h-full object-cover opacity-50" />}
                                    <div className="absolute inset-0 bg-gradient-to-t from-[#F2F2F7] dark:from-[#0A0A0C] via-transparent to-transparent" />
                                    {viewingItem.status === 'none' && (
                                        <button onClick={() => interactWithTempItem({status: 'backlog'})} className="absolute bottom-6 right-6 bg-accent text-white px-5 py-3 rounded-full font-black text-sm shadow-lg shadow-accent/50 z-50 bouncy-tap animate-spring-up"><Icon.Plus s={18} c="mr-1.5 inline"/> Vault It</button>
                                    )}
                                </>
                            )}
                            <button onClick={() => { haptic(); setViewingItem(null); }} className="absolute top-14 left-6 w-12 h-12 bg-white/60 dark:bg-black/60 backdrop-blur-xl rounded-full flex items-center justify-center z-50 border border-black/5 dark:border-white/10 bouncy-tap"><Icon.ChevronL s={24} /></button>
                        </div>

                        <div className="px-6 -mt-24 relative z-10">
                            <div className="flex space-x-5 mb-8 items-end animate-spring-up">
                                <div className="w-[120px] h-[180px] bg-white dark:bg-[#151517] rounded-3xl shadow-2xl overflow-hidden flex-shrink-0 border border-black/5 dark:border-white/5">
                                    {viewingItem.image ? <img src={viewingItem.image} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center"><Icon.Film s={48} c="text-gray-400"/></div>}
                                </div>
                                <div className="pb-2 flex-1">
                                    <h1 className="text-3xl font-black leading-tight mb-2 tracking-tight">{viewingItem.title}</h1>
                                    <div className="flex flex-wrap gap-2 text-[10px] font-black uppercase text-gray-500 mb-2"><span>{viewingItem.type}</span><span>{viewingItem.year}</span>{viewingItem.runtime && <span>{viewingItem.runtime}m</span>}</div>
                                    <div className="flex flex-wrap gap-2">

                                        )}
                                        {viewingItem.rating && (

                                    )}
                                </div>
                            </div>

                            {/* CORE STATUS BUTTONS */}
                            <div className="grid grid-cols-4 gap-3 mb-3">
                                {[ { id: 'backlog', l: 'Plan', i: <Icon.List s={20}/>, c: 'text-gray-700 dark:text-white bg-white dark:bg-[#151517] shadow-sm' }, { id: 'watching', l: 'Active', i: <Icon.Play s={20} fill="currentColor"/>, c: 'text-accent bg-accent/10 border-accent/20 scale-105' }, { id: 'completed', l: 'Done', i: <Icon.Check s={20}/>, c: 'text-green-500 bg-green-500/10 scale-105' }, { id: 'dropped', l: 'Drop', i: <Icon.X s={20}/>, c: 'text-red-500 bg-red-500/10' } ].map(btn => (
                                    <button key={btn.id} onClick={() => interactWithTempItem({ status: btn.id })} className={`flex flex-col items-center justify-center py-4 rounded-[1.5rem] shadow-sm bouncy-tap border ${viewingItem.status === btn.id ? btn.c : 'bg-white dark:bg-[#151517] border-black/5 dark:border-white/5 text-gray-400'}`}>
                                        {btn.i}<span className="text-[9px] font-black mt-2 uppercase">{btn.l}</span>
                                    </button>
                                ))}
                            </div>

                            {/* INLINE ACTION TOGGLES (PLAYLIST / NOTES / PROGRESS) */}
                            {viewingItem.status !== 'none' && (
                                <div className="mb-8">
                                    <div className="flex gap-2">
                                        <button onClick={() => setInlineActionTab(inlineActionTab === 'playlist' ? null : 'playlist')} className={`flex-1 py-3 rounded-2xl text-[10px] font-black uppercase flex items-center justify-center transition-colors ${inlineActionTab === 'playlist' ? 'bg-accent text-white' : 'bg-gray-200 dark:bg-[#2C2C2E] text-gray-500'}`}><Icon.Grid s={14} c="mr-1.5"/> Playlist</button>

                                        <button onClick={() => setInlineActionTab(inlineActionTab === 'progress' ? null : 'progress')} className={`flex-1 py-3 rounded-2xl text-[10px] font-black uppercase flex items-center justify-center transition-colors ${inlineActionTab === 'progress' ? 'bg-accent text-white' : 'bg-gray-200 dark:bg-[#2C2C2E] text-gray-500'}`}><Icon.Chart s={14} c="mr-1.5"/> Progress</button>
                                    </div>
                                    
                                    {/* DYNAMIC ACTION CONTENT */}
                                    <div className="mt-3 overflow-hidden transition-all duration-300">
                                        {inlineActionTab === 'playlist' && (
                                            <div className="bg-white dark:bg-[#151517] p-4 rounded-3xl border border-black/5 dark:border-white/5 animate-slide-down">

                                                        return (
                                                            <button key={pl.id} onClick={() => { haptic(); setPlaylists(p => p.map(x => x.id === pl.id ? { ...x, itemIds: isIn ? x.itemIds.filter(id => id !== viewingItem.id) : [...x.itemIds, viewingItem.id] } : x)); }} className={`px-4 py-2.5 rounded-xl text-xs font-black whitespace-nowrap bouncy-tap border ${isIn ? 'bg-accent text-white border-transparent' : 'bg-gray-50 dark:bg-[#1C1C1E] text-gray-500 border-black/5 dark:border-white/5'}`}>
                                                                {pl.icon} {pl.name}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>

                                        {inlineActionTab === 'notes' && (

                                                <textarea placeholder="Write personal notes, thoughts, or reminders here..." value={viewingItem.personalNote || ''} onChange={(e) => interactWithTempItem({personalNote: e.target.value})} className="w-full bg-gray-50 dark:bg-[#1C1C1E] text-sm font-bold px-4 py-3 rounded-2xl focus:outline-none border border-black/5 dark:border-white/5 resize-none h-24"></textarea>

                                        {inlineActionTab === 'progress' && (

                                                <span className="text-[10px] uppercase font-bold text-gray-500 ml-1">Episode / Progress</span>
                                                <input type="text" placeholder="e.g. S2 E4 or 1h 20m" value={viewingItem.resumeEp || ''} onChange={e => interactWithTempItem({resumeEp: e.target.value})} className="w-full mt-1 bg-gray-50 dark:bg-[#1C1C1E] px-4 py-3 rounded-xl font-bold text-sm focus:outline-none border border-black/5 dark:border-white/5" />
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            <ExpandableText text={viewingItem.desc} maxChars={180} />

                            <div className="mb-8 border-t border-black/5 dark:border-white/5 pt-6 animate-spring-up" style={{animationDelay: "0.15s"}}>
                                <h3 className="text-xs font-black text-gray-500 uppercase tracking-wider mb-4">DNA & Tags</h3>
                                <div className="flex flex-wrap gap-2 mb-4">
                                    {viewingItem.isMature && (
                                        <span className="bg-red-500/15 text-red-500 px-3 py-1.5 rounded-lg text-xs font-black border border-red-500/30 flex items-center">🔞 18+{viewingItem.certification ? ` · ${viewingItem.certification}` : ''}</span>
                                    )}
                                    {!viewingItem.isMature && viewingItem.certification && (
                                        <span className="bg-gray-200/50 dark:bg-[#1C1C1E] px-3 py-1.5 rounded-lg text-xs font-bold text-gray-500">{viewingItem.certification}</span>

                                    {safeGenres.map(g => (
                                        <button key={g} onClick={() => openGenreGrid(g)} className="bg-gray-200/50 dark:bg-[#1C1C1E] px-3 py-1.5 rounded-lg text-xs font-bold text-gray-700 dark:text-gray-300 bouncy-tap hover:bg-gray-300 dark:hover:bg-[#2C2C2E] transition-colors"># {g}</button>
