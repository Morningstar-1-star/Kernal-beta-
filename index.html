                                    {safeCustomTags.map(t => (
                                        <button key={t} onClick={() => { setGlobalTagFilters([t]); setViewingItem(null); setActiveNav('library'); }} className="bg-accent/10 text-accent px-3 py-1.5 rounded-lg text-xs font-bold border border-accent/20 flex items-center bouncy-tap">
                                            # {t} <span onClick={(e) => { e.stopPropagation(); interactWithTempItem({customTags: safeCustomTags.filter(x => x !== t)}); }} className="ml-2 text-red-500 font-bold"><Icon.X s={12}/></span>
                                        </button>
                                    ))}
                                    {safeLanguages.map(lang => (
                                        <span key={lang} className="bg-blue-500/10 text-blue-500 dark:text-blue-400 px-3 py-1.5 rounded-lg text-xs font-bold border border-blue-500/20">🗣 {lang}</span>
                                    ))}
                                </div>
                                {viewingItem.status !== 'none' && (
                                    <div className="flex space-x-2">
                                        <input type="text" placeholder="Add custom tag..." onKeyPress={(e) => { if(e.key === 'Enter' && e.target.value.trim()){ interactWithTempItem({customTags: [...safeCustomTags, e.target.value.trim()]}); e.target.value=''; } }} className="flex-1 bg-white dark:bg-[#151517] text-sm font-bold px-4 py-3 rounded-2xl focus:outline-none border border-black/5 dark:border-white/5" />
                                    </div>
                                )}
                            </div>

                            {(safeVideos.length > 0 || safeImages.length > 0) && (
                                <div className="mb-8 border-t border-black/5 dark:border-white/5 pt-6 animate-spring-up" style={{animationDelay: "0.2s"}}>
                                    <h3 className="text-xs font-black text-gray-500 uppercase tracking-wider mb-4">Media</h3>
                                    <div className="flex overflow-x-auto space-x-3 hide-scrollbar pb-2">
                                        {safeVideos.map((vid, idx) => (
                                            <div key={idx} onClick={() => { haptic(); setActiveTrailer(vid.key); }} className="w-[200px] flex-shrink-0 cursor-pointer relative rounded-2xl overflow-hidden h-[112px] border border-black/5 dark:border-white/5 shadow-sm bouncy-tap">
                                                <img src={`https://img.youtube.com/vi/${vid.key}/mqdefault.jpg`} className="w-full h-full object-cover"/>
                                                <div className="absolute inset-0 bg-black/40 flex flex-col items-center justify-center"><Icon.Play s={28} c="text-white mb-1" fill="currentColor"/><span className="text-[10px] text-white font-bold px-2 truncate w-full text-center">{vid.name}</span></div>
                                            </div>
                                        ))}
                                        {safeImages.map((img, idx) => (
                                            <div key={`img_${idx}`} className="w-[200px] flex-shrink-0 relative rounded-2xl overflow-hidden h-[112px] border border-black/5 dark:border-white/5 shadow-sm">
                                                <img src={img} className="w-full h-full object-cover"/>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <div className="mb-8 border-t border-black/5 dark:border-white/5 pt-6 animate-spring-up" style={{animationDelay: "0.25s"}}>
                                <h3 className="text-xs font-black text-gray-500 uppercase tracking-wider mb-4">🇮🇳 Where to Watch</h3>

                                {/* JustWatch providers — primary source */}
                                {safeJWProviders.length > 0 ? (
                                    <div className="mb-4 space-y-2">
                                        {safeJWProviders.map((p, i) => {
                                            const typeLabel = { FLATRATE: '✅ Subscription', FREE: '🆓 Free', RENT: `🎬 Rent${p.price ? ' · '+p.price : ''}`, BUY: `💳 Buy${p.price ? ' · '+p.price : ''}`, ADS: '📺 Free with Ads' }[p.type] || p.type;
                                            return (
                                                <div key={i} className="flex items-center bg-white dark:bg-[#151517] rounded-2xl px-4 py-3 border border-black/5 dark:border-white/5">
                                                    {p.iconUrl ? <img src={p.iconUrl} className="w-9 h-9 rounded-xl mr-3 flex-shrink-0" onError={e => e.target.style.display='none'}/> : <div className="w-9 h-9 rounded-xl mr-3 bg-gray-200 dark:bg-[#2C2C2E] flex-shrink-0 flex items-center justify-center text-lg">📺</div>}
                                                    <div className="flex-1">
                                                        <p className="font-black text-sm">{p.name}</p>
                                                        <p className="text-[10px] text-gray-500 font-bold mt-0.5">{typeLabel}</p>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                ) : safeStream.length > 0 ? (
                                    /* Fallback: TMDB stream logos */
                                    <div className="mb-4">
                                        <span className="text-[10px] font-bold text-gray-400 block mb-2">STREAM (via TMDB)</span>
                                        <div className="flex gap-2">{safeStream.slice(0,5).map((p,i) => <img key={i} src={`https://image.tmdb.org/t/p/original${p.logo_path}`} className="w-10 h-10 rounded-xl bouncy-tap" title={p.provider_name}/>)}</div>
                                    </div>
                                ) : (
                                    <p className="text-xs text-gray-400 font-bold mb-4 bg-white dark:bg-[#151517] rounded-2xl px-4 py-3 border border-black/5 dark:border-white/5">Not currently streaming in India 🇮🇳</p>
                                )}

                                {/* Custom Sources */}
                                {safeCustomSources.length > 0 && (
                                    <div>
                                        <span className="text-[10px] font-bold text-gray-400 block mb-2">CUSTOM SOURCES</span>
                                        <div className="flex flex-wrap gap-2">
                                            {safeCustomSources.map((site, i) => (
                                                <a key={i} onClick={haptic} href={site.url.replace('{q}', encodeURIComponent(viewingItem.title))} target="_blank" className="flex items-center bg-white dark:bg-[#151517] rounded-xl px-4 py-3 border border-black/5 dark:border-white/5 bouncy-tap">
                                                    <img src={`https://www.google.com/s2/favicons?sz=64&domain=${site.domain}`} className="w-4 h-4 mr-2 rounded-sm"/><span className="font-bold text-xs">{site.name}</span>
                                                </a>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>

                            {viewingItem.seasons?.length > 0 && (
                                <SeasonsList seasons={viewingItem.seasons} tmdbId={viewingItem.aid} tmdbToken={getTMDB()} language={settings.language} />
                            )}

                            {safeCast.length > 0 && (
                                <div className="mb-8 border-t border-black/5 dark:border-white/5 pt-6 animate-spring-up" style={{animationDelay: "0.3s"}}>
                                    <h3 className="text-xs font-black text-gray-500 uppercase tracking-wider mb-4">Cast Nexus</h3>
                                    <div className="flex overflow-x-auto space-x-4 hide-scrollbar pb-2">
                                        {safeCast.map(actor => (
                                            <div key={actor.id} onClick={() => fetchActor(actor)} className="w-[80px] flex-shrink-0 text-center cursor-pointer bouncy-tap">
                                                <div className="w-16 h-16 mx-auto bg-gray-200 dark:bg-[#1C1C1E] rounded-full overflow-hidden mb-2 border border-black/5 dark:border-white/5">{actor.image && <img src={actor.image} className="w-full h-full object-cover"/>}</div>
                                                <p className="text-[10px] font-black leading-tight truncate">{actor.name}</p>
                                                <p className="text-[9px] text-gray-500 font-bold truncate mt-0.5">{actor.role}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {safeReviews.length > 0 && (
                                <div className="mb-8 border-t border-black/5 dark:border-white/5 pt-6 animate-spring-up" style={{animationDelay: "0.32s"}}>
                                    <h3 className="text-xs font-black text-gray-500 uppercase tracking-wider mb-4">Reviews</h3>
                                    <div className="space-y-3">
                                        {safeReviews.map((rev, i) => (
                                            <div key={i} className="bg-white dark:bg-[#151517] rounded-2xl p-4 border border-black/5 dark:border-white/5">
                                                <div className="flex items-center mb-2">
                                                    <div className="w-8 h-8 rounded-full overflow-hidden bg-gray-200 dark:bg-[#1C1C1E] mr-2.5 flex-shrink-0 flex items-center justify-center">
                                                        {rev.avatar ? <img src={rev.avatar} className="w-full h-full object-cover"/> : <Icon.User s={14} c="text-gray-400"/>}
                                                    </div>
                                                    <span className="font-black text-xs flex-1 truncate">{rev.author}</span>
                                                    {rev.rating && <span className="text-[10px] font-black bg-yellow-500/15 text-yellow-500 px-2 py-1 rounded-lg flex-shrink-0">★ {rev.rating}</span>}
                                                </div>
                                                <ExpandableText text={rev.content} maxChars={220} />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {safeRecs.length > 0 && (
                                <div className="mb-8 border-t border-black/5 dark:border-white/5 pt-6 animate-spring-up" style={{animationDelay: "0.35s"}}>
                                    <h3 className="text-xs font-black text-gray-500 uppercase tracking-wider mb-4">Related Artifacts</h3>
                                    <div className="flex overflow-x-auto space-x-4 hide-scrollbar pb-2 -mx-6 px-6">
                                        {safeRecs.map(rec => (
                                            <div key={rec.id} onClick={() => openDetail(rec)} className="w-[100px] flex-shrink-0 cursor-pointer bouncy-tap">
                                                <div className="h-36 bg-gray-200 dark:bg-[#1C1C1E] rounded-[1.2rem] overflow-hidden mb-2 shadow-sm border border-black/5 dark:border-white/5 relative">
                                                    {rec.image ? <img src={rec.image} className="w-full h-full object-cover transition-transform duration-500 hover:scale-110"/> : <div className="w-full h-full flex justify-center items-center"><Icon.Film s={24} c="text-gray-400"/></div>}
                                                </div>
                                                <p className="text-[10px] font-bold text-center leading-tight line-clamp-2 px-1">{rec.title}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="app-container">
                    {toast && <Toast msg={toast} onClose={() => setToast(null)} />}
                    
                    {/* TOP NAV BAR */}
                    {activeNav !== 'explore' && (
                        <header className="pt-[calc(env(safe-area-inset-top,0px)+3.5rem)] pb-4 px-6 glass-panel sticky top-0 z-20">
                            <div className="flex justify-between items-center mb-4">
                                <h1 className="text-4xl font-black tracking-tight capitalize">{activeNav}</h1>
                                {activeNav === 'library' && (
                                    <div className="flex space-x-3">
                                        <button onClick={() => updateSetting('layout', settings.layout === 'grid' ? 'list' : 'grid')} className="p-2.5 bg-white dark:bg-[#1C1C1E] rounded-full shadow-sm bouncy-tap"><Icon.List s={20}/></button>
                                        <button onClick={() => { setAddState(p => ({...p, open:true, tab: 'search', query: ''})); setBulkState({input:'', results:[], loading:false, preview:false}); }} className="p-2.5 bg-accent text-white rounded-full shadow-lg shadow-accent/50 bouncy-tap"><Icon.Plus s={20}/></button>
                                    </div>
                                )}
                            </div>
                            {activeNav === 'library' && (
                                <div>
                                    <div className="relative">
                                        <Icon.Search s={18} c="absolute left-4 top-[12px] text-gray-400" />
                                        <input type="text" placeholder="Search title, actor, or #tag..." value={internalQuery} onChange={e => setInternalQuery(e.target.value)} className="w-full bg-white dark:bg-[#1C1C1E] text-black dark:text-white rounded-2xl py-3 pl-12 pr-4 text-sm font-medium focus:outline-none border border-black/5 dark:border-white/10 shadow-sm transition-all duration-300 focus:shadow-md" />
                                    </div>
                                </div>
                            )}
                        </header>
                    )}

                    <main className="flex-1 overflow-y-auto hide-scrollbar pb-32" onScroll={handleScroll}>
                        {/* EXPLORE PAGE */}
                        {activeNav === 'explore' && (
                            <div className="relative pb-10">
                                {exploreData.trending.length > 0 && (() => {
                                    const heroItem = exploreData.trending[heroIndex];
                                    return (
                                        <div
                                            className="relative w-full h-[65vh] flex items-end p-6 cursor-pointer group overflow-hidden"
                                            onClick={() => { if (heroMoved.current) { heroMoved.current = false; return; } openDetail(heroItem); }}
                                            onTouchStart={onHeroTouchStart} onTouchMove={onHeroTouchMove} onTouchEnd={onHeroTouchEnd}
                                        >
                                            <img src={heroItem.backdrop || heroItem.image} className="absolute inset-0 w-full h-full object-cover transition-transform duration-300 ease-out" style={{ transform: `translateX(${heroOffset}px) scale(1.03)` }} />
                                            <div className="absolute inset-0 hero-gradient" />
                                            <div className="relative z-10 w-full">
                                                <div className="bg-red-500 text-white text-[10px] font-black uppercase px-3 py-1.5 rounded-lg inline-flex items-center mb-3 shadow-lg animate-pulse-glow"><Icon.Film s={12} c="mr-1"/> Trending Now</div>
                                                <h2 className="text-4xl font-black text-white leading-tight mb-2 drop-shadow-2xl">{heroItem.title}</h2>
                                                <div className="flex gap-3 mt-4">
                                                    <button onClick={(e) => { e.stopPropagation(); openDetail(heroItem); }} className="flex-1 py-4 bg-white/20 backdrop-blur-xl text-white rounded-2xl font-black border border-white/20 bouncy-tap flex justify-center items-center"><Icon.Play s={20} fill="currentColor" c="mr-2"/> View</button>
                                                    <button onClick={(e) => { e.stopPropagation(); addToVaultFast(heroItem); }} className="w-14 bg-accent text-white rounded-2xl flex justify-center items-center shadow-lg shadow-accent/50 bouncy-tap"><Icon.Plus s={24}/></button>
                                                </div>
                                                {exploreData.trending.length > 1 && (
                                                    <div className="flex justify-center gap-1.5 mt-5">
                                                        {exploreData.trending.map((_, i) => (
                                                            <div key={i} className={`h-1.5 rounded-full transition-all duration-300 ${i === heroIndex ? 'w-6 bg-white' : 'w-1.5 bg-white/40'}`} />
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })()}
                                {exploreLoading && exploreData.trending.length === 0 ? (
                                    <div className="flex justify-center items-center h-40"><Icon.Loader s={40} c="text-accent" /></div>
                                ) : (
                                    <div className="px-6 mt-10 space-y-10">
                                        {exploreData.popMovies?.length > 0 && <div><h3 className="font-black text-2xl mb-5 flex items-center"><Icon.Film s={24} c="mr-2 text-accent"/> Popular Movies</h3>{renderCardList(exploreData.popMovies)}</div>}
                                        {exploreData.popTv?.length > 0 && <div><h3 className="font-black text-2xl mb-5 flex items-center"><Icon.Tv s={24} c="mr-2 text-indigo-500"/> Popular Series</h3>{renderCardList(exploreData.popTv)}</div>}
                                        {exploreData.anime?.length > 0 && (
                                            <div>
                                                <h3 onClick={openAnimeGrid} className="font-black text-2xl mb-5 flex items-center cursor-pointer bouncy-tap w-max hover:text-accent transition-colors">
                                                    <Icon.Sparkles s={24} c="mr-2 text-pink-500"/> Top Anime <Icon.ChevronL s={18} c="ml-2 rotate-180 opacity-50" />
                                                </h3>
                                                {renderCardList(exploreData.anime)}
                                            </div>
                                        )}
                                        
                                        {exploreData.extras?.map((extraSec, idx) => (
                                            <div key={idx}>
                                                <h3 onClick={() => openGenreGrid(extraSec.title, extraSec.id, extraSec.type)} className="font-black text-2xl mb-5 flex items-center cursor-pointer bouncy-tap w-max hover:text-accent transition-colors">
                                                    {extraSec.iconName && React.createElement(Icon[extraSec.iconName] || Icon.Film, { s: 24, c: "mr-2 " + extraSec.iconColor })} {extraSec.title} <Icon.ChevronL s={18} c="ml-2 rotate-180 opacity-50" />
                                                </h3>
                                                {renderCardList(extraSec.items)}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* LIBRARY / VAULT PAGE */}
                        {activeNav === 'library' && (
                            <div className="px-6 pt-4 animate-spring-up">
                                {/* SMART TAGS — tap to toggle, multi-select, related tags expand below once you pick one */}
                                <div className="flex items-center gap-2 mb-2 -mx-6 px-6 overflow-x-auto hide-scrollbar">
                                    {SMART_TAG_CATALOG.map(tag => {
                                        const active = globalTagFilters.includes(tag);
                                        return (
                                            <button key={tag} onClick={() => toggleTagFilter(tag)} className={`flex-shrink-0 px-4 py-2 rounded-2xl text-xs font-black whitespace-nowrap bouncy-tap border transition-all ${active ? 'bg-accent text-white border-transparent shadow-lg shadow-accent/30 scale-105' : 'bg-white dark:bg-[#1C1C1E] text-gray-500 border-black/5 dark:border-white/10'}`}>
                                                {tag === '18+' ? '🔞 18+' : `#${tag}`}
                                            </button>
                                        );
                                    })}
                                    <button onClick={() => setFilterSheetOpen(true)} className="flex-shrink-0 w-9 h-9 bg-gray-100 dark:bg-[#1C1C1E] rounded-2xl flex items-center justify-center bouncy-tap" title="Status, sort & random pick">
                                        <Icon.Settings s={16}/>
                                    </button>
                                </div>
                                {relatedTags.length > 0 && (
                                    <div className="flex items-center gap-2 mb-2 -mx-6 px-6 overflow-x-auto hide-scrollbar animate-fade-in">
                                        <span className="text-[9px] font-black uppercase text-gray-400 flex-shrink-0">Related</span>
                                        {relatedTags.map(tag => (
                                            <button key={tag} onClick={() => toggleTagFilter(tag)} className="flex-shrink-0 px-3 py-1.5 rounded-xl text-[10px] font-bold bg-accent/10 text-accent bouncy-tap whitespace-nowrap">#{tag}</button>
                                        ))}
                                    </div>
                                )}
                                {globalTagFilters.length > 0 && (
                                    <div className="flex items-center flex-wrap gap-2 mb-5 animate-spring-pop">
                                        {globalTagFilters.map(tag => (
                                            <span key={tag} onClick={() => toggleTagFilter(tag)} className="inline-flex items-center bg-accent text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow-sm bouncy-tap"><Icon.Tag s={12} c="mr-1.5"/>{tag}<Icon.X s={12} c="ml-2"/></span>
                                        ))}
                                        <button onClick={() => setGlobalTagFilters([])} className="text-xs font-bold text-gray-500 underline bouncy-tap">Clear all</button>
                                    </div>
                                )}
                                {globalTagFilters.length === 0 && relatedTags.length === 0 && <div className="mb-3" />}
                                <div className={settings.layout === 'grid' ? "grid grid-cols-2 gap-4" : "flex flex-col gap-4"}>
                                    {filteredVault.map((item, idx) => (
                                        <SwipeCard key={item.id} item={item} onUpdate={syncUpdate} onDelete={deleteItem} onOpen={openDetail}>
                                            {settings.layout === 'grid' ? (
                                                <div className="flex flex-col h-full rounded-3xl relative animate-spring-up" style={{animationDelay: `${idx * 0.03}s`}}>
                                                    {item.status === 'backlog' && <div className="absolute -top-1 -right-1 w-4 h-4 bg-accent rounded-full border-2 border-white dark:border-[#151517] z-10 animate-pulse-glow"></div>}
                                                    <div className="relative h-56 w-full bg-gray-200 dark:bg-[#1C1C1E] overflow-hidden rounded-t-3xl">
                                                        {item.image ? <img src={item.image} loading="lazy" className="w-full h-full object-cover transition-transform duration-500 hover:scale-110" /> : <div className="w-full h-full flex items-center justify-center">{getIcon(item.type, 40)}</div>}
                                                    </div>
                                                    <div className="p-4 flex-1 flex flex-col justify-between">
                                                        <div><h3 className="font-black text-sm leading-tight line-clamp-2">{item.title}</h3><p className="text-[10px] text-gray-500 font-bold mt-1 uppercase">{item.year}</p></div>
                                                        {item.soulRating > 0 && <div className="w-full bg-gray-200 dark:bg-gray-800 h-1.5 rounded-full mt-3 overflow-hidden"><div className="bg-gradient-to-r from-red-500 to-green-500 h-full transition-all duration-1000" style={{ width: `${item.soulRating}%` }}></div></div>}
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="flex p-3 gap-4 w-full items-center rounded-3xl relative animate-spring-up" style={{animationDelay: `${idx * 0.03}s`}}>
                                                    {item.status === 'backlog' && <div className="absolute top-2 left-2 w-3 h-3 bg-accent rounded-full border-2 border-white dark:border-[#151517] z-10 animate-pulse-glow"></div>}
                                                    <div className="w-16 h-24 bg-gray-200 dark:bg-[#1C1C1E] rounded-[1.2rem] overflow-hidden flex-shrink-0 relative">
                                                        {item.image ? <img src={item.image} loading="lazy" className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center">{getIcon(item.type, 24)}</div>}
                                                    </div>
                                                    <div className="flex-1 flex flex-col justify-center pr-2">
                                                        <h3 className="font-black text-base leading-tight line-clamp-1 mb-1">{item.title}</h3>
                                                        <span className="text-xs text-gray-500 font-bold uppercase">{item.type} • {item.year}</span>
                                                    </div>
                                                </div>
                                            )}
                                        </SwipeCard>
                                    ))}
                                    {filteredVault.length === 0 && <div className="col-span-2 text-center text-gray-400 font-bold mt-10 animate-spring-pop">Vault is empty. Add some artifacts.</div>}
                                </div>
                            </div>
                        )}

                        {/* PLAYLISTS / DECKS PAGE */}
                        {activeNav === 'decks' && (
                            <div className="px-6 space-y-4 pt-4 animate-spring-up">
                                {!activeDeck ? (
                                    <>
                                        <div className="bg-white dark:bg-[#151517] p-5 rounded-3xl shadow-sm mb-6 flex space-x-3 border border-black/5 dark:border-white/5">
                                            <input value={newPlaylistName} onChange={e => setNewPlaylistName(e.target.value)} placeholder="New playlist name..." className="flex-1 bg-gray-50 dark:bg-[#1C1C1E] px-4 py-3 rounded-2xl font-bold text-sm focus:outline-none transition-all duration-300 focus:shadow-md" />
                                            <button onClick={() => { if(newPlaylistName.trim()) { setPlaylists(p => [...p, {id: Date.now(), name: newPlaylistName.trim(), icon: '📁', itemIds: []}]); setNewPlaylistName(''); haptic(); showToast("Playlist Created!"); } }} className="bg-accent text-white px-5 rounded-2xl font-black bouncy-tap shadow-lg shadow-accent/50">Add</button>
                                        </div>

                                        <div onClick={() => setActiveDeck({ name: "Highest Rated (Soul Meter)", icon: "🔥", itemIds: vault.filter(v=>v.soulRating>80).map(v=>v.id) })} className="bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-3xl p-5 flex items-center shadow-lg cursor-pointer bouncy-tap">
                                            <span className="text-3xl mr-4">🔥</span><div><h3 className="font-black text-lg">Top Rated</h3><p className="text-xs font-bold opacity-80">Auto-generated</p></div>
                                        </div>

                    <div className={`absolute inset-0 z-[65] flex flex-col justify-end transition-all duration-400 ${filterSheetOpen ? 'visible' : 'invisible'}`}>
                        <div className={`absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity duration-400 ${filterSheetOpen ? 'opacity-100' : 'opacity-0'}`} onClick={() => setFilterSheetOpen(false)} />
                        <div className={`bg-[#F2F2F7] dark:bg-[#0A0A0C] w-full rounded-t-[2.5rem] shadow-2xl relative z-10 flex flex-col transition-transform duration-500 ease-out pb-8 ${filterSheetOpen ? 'translate-y-0' : 'translate-y-full'}`}>
                            <div className="flex justify-between items-center p-6 border-b border-black/5 dark:border-white/5"><h3 className="font-black text-xl">Status, Sort & Pick</h3><button onClick={() => setFilterSheetOpen(false)} className="bg-gray-200 dark:bg-[#1C1C1E] p-2 rounded-full bouncy-tap"><Icon.X s={20}/></button></div>
                            <div className="p-6 space-y-5">
                                <div>
                                    <p className="text-[10px] font-black uppercase text-gray-400 mb-2">Status</p>
                                    <div className="grid grid-cols-4 gap-2">
                                        {[ { id: 'all', l: 'All' }, { id: 'backlog', l: 'Backlog' }, { id: 'watching', l: 'Active' }, { id: 'completed', l: 'Done' } ].map(f => (
                                            <button key={f.id} onClick={() => { haptic(); setFilterStatus(f.id); }} className={`py-2 text-[11px] font-black rounded-xl bouncy-tap ${filterStatus === f.id ? 'bg-accent text-white shadow-lg shadow-accent/40 scale-105' : 'bg-white dark:bg-[#1C1C1E] text-gray-500'}`}>
                                                {f.l}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <p className="text-[10px] font-black uppercase text-gray-400 mb-2">Sort by</p>
                                    <div className="flex gap-1.5 bg-gray-100 dark:bg-[#1C1C1E] p-1 rounded-2xl">
                                        {[{id:'recent',l:'New'},{id:'title',l:'A-Z'},{id:'year',l:'Year'},{id:'rating',l:'⭐'}].map(s => (
                                            <button key={s.id} onClick={() => { haptic(); setVaultSort(s.id); }} className={`flex-1 py-2 text-[11px] font-black rounded-xl bouncy-tap transition-all duration-200 ${vaultSort === s.id ? 'bg-white dark:bg-[#2C2C2E] shadow-sm text-accent scale-105' : 'text-gray-500'}`}>{s.l}</button>
                                        ))}
                                    </div>
                                </div>
                                <button onClick={() => {
                                    haptic();
                                    const backlog = vault.filter(v => v.status === 'backlog');
                                    if(backlog.length === 0) { showToast("No backlog items!"); return; }
                                    const pick = backlog[Math.floor(Math.random() * backlog.length)];
                                    setFilterSheetOpen(false);
                                    openDetail(pick);
                                }} className="w-full py-3.5 bg-gradient-to-br from-purple-500 to-pink-500 text-white rounded-2xl flex items-center justify-center gap-2 shadow-lg font-black text-sm rubber-btn">
                                    🎲 Random Pick From Backlog
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className={`absolute inset-0 z-[65] flex flex-col justify-end transition-all duration-400 ${deckPickerOpen ? 'visible' : 'invisible'}`}>
                        <div className={`absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity duration-400 ${deckPickerOpen ? 'opacity-100' : 'opacity-0'}`} onClick={() => setDeckPickerOpen(false)} />
                        <div className={`bg-[#F2F2F7] dark:bg-[#0A0A0C] w-full h-[80vh] rounded-t-[2.5rem] shadow-2xl relative z-10 flex flex-col transition-transform duration-500 ease-out ${deckPickerOpen ? 'translate-y-0' : 'translate-y-full'}`}>
                            <div className="flex justify-between items-center p-6 border-b border-black/5 dark:border-white/5"><h3 className="font-black text-xl">Add to {activeDeck?.name}</h3><button onClick={() => setDeckPickerOpen(false)} className="bg-gray-200 dark:bg-[#1C1C1E] p-2 rounded-full bouncy-tap"><Icon.X s={20}/></button></div>
                            <div className="flex-1 overflow-y-auto p-6 space-y-3">
                                {vault.map(item => {
                                    const isInDeck = activeDeck?.itemIds.includes(item.id);
                                    return (
                                        <div key={item.id} onClick={() => {haptic();setPlaylists(p => p.map(x => x.id === activeDeck.id ? { ...x, itemIds: isInDeck ? x.itemIds.filter(id => id !== item.id) : [...x.itemIds, item.id] } : x));setActiveDeck(prev => ({...prev, itemIds: isInDeck ? prev.itemIds.filter(id => id !== item.id) : [...prev.itemIds, item.id]}));}} className={`flex items-center p-3 rounded-2xl border cursor-pointer bouncy-tap ${isInDeck ? 'bg-accent/10 border-accent/30' : 'bg-white dark:bg-[#151517] border-black/5 dark:border-white/5'}`}>
                                            <img src={item.image} className="w-10 h-14 object-cover rounded-lg mr-4 bg-gray-200 dark:bg-[#1C1C1E]" />
                                            <span className="flex-1 font-black text-sm">{item.title}</span>
                                            {isInDeck ? <Icon.Check s={20} c="text-accent" /> : <Icon.Plus s={20} c="text-gray-300" />}
                                        </div>
                                    )
                                })}
                                {vault.length === 0 && <p className="text-center font-bold text-gray-500 mt-10">Vault is empty.</p>}
                            </div>
                        </div>
                    </div>

                    {/* ADD / SEARCH MODAL */}
                    <div className={`absolute inset-0 z-[60] flex flex-col justify-end transition-all duration-400 ${addState.open ? 'visible' : 'invisible'}`}>
                        <div className={`absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity duration-400 ${addState.open ? 'opacity-100' : 'opacity-0'}`} onClick={() => setAddState(p => ({...p, open: false}))} />
                        <div className={`bg-[#F2F2F7] dark:bg-[#0A0A0C] w-full h-[90vh] rounded-t-[2.5rem] shadow-2xl relative z-10 flex flex-col transition-transform duration-500 ease-out ${addState.open ? 'translate-y-0' : 'translate-y-full'}`}>
                            <div className="flex p-4 mt-2 mx-6 bg-gray-200 dark:bg-[#1C1C1E] rounded-2xl mb-4">
                                {[ { id: 'search', l: 'Global' }, { id: 'ai', l: 'AI Finder' }, { id: 'bulk', l: 'Bulk Paste' } ].map(t => (
                                    <button key={t.id} onClick={() => { setAddState(p => ({...p, tab: t.id, query: '', results: []})); setBulkState({input:'', results:[], loading:false, preview:false}); }} className={`flex-1 py-2 text-xs font-black rounded-xl bouncy-tap transition-all ${addState.tab === t.id ? 'bg-white dark:bg-[#2C2C2E] shadow-sm scale-105' : 'text-gray-500'}`}>
                                        {t.l}
                                    </button>
                                ))}
                            </div>
                            
                            <div className="px-6 flex-1 flex flex-col overflow-hidden">
                                {/* BULK TAB */}
                                {addState.tab === 'bulk' && (
                                    <div className="flex flex-col h-full animate-spring-up">
                                                        {!bulkState.preview ? (
                                            <>
                                                <textarea value={bulkState.input} onChange={e => setBulkState(p => ({...p, input: e.target.value}))} placeholder="Interstellar&#10;Naruto&#10;The Matrix (1999)..." className="flex-1 w-full bg-white dark:bg-[#151517] p-4 rounded-3xl resize-none text-sm font-bold focus:outline-none mb-4 shadow-sm border border-black/5 dark:border-white/5"></textarea>
                                                <button onClick={processBulkImport} disabled={bulkState.loading} className="w-full py-4 bg-accent text-white rounded-2xl font-black mb-8 bouncy-tap">
                                                    {bulkState.loading ? <Icon.Loader s={20} c="mx-auto"/> : "Process Import"}
                                                </button>
                                            </>
                                        ) : (
                                            <div className="flex flex-col h-full pb-8">
                                                {/* PROGRESS BAR while loading */}
                                                {bulkState.loading && (
                                                    <div className="mb-4 animate-spring-up">
                                                        <div className="flex justify-between text-xs font-black mb-2">
                                                            <span className="text-gray-500 truncate flex-1 mr-2">🔍 {bulkState.currentTitle || '...'}</span>
                                                            <span className="text-accent">{bulkState.progress || 0}/{bulkState.total || 0}</span>
                                                        </div>
                                                        <div className="w-full bg-gray-200 dark:bg-[#1C1C1E] h-2.5 rounded-full overflow-hidden">
                                                            <div className="bg-accent h-full rounded-full transition-all duration-300" style={{width: `${bulkState.total ? ((bulkState.progress||0)/bulkState.total)*100 : 0}%`}}></div>
                                                        </div>
                                                        <p className="text-[10px] text-gray-400 font-bold text-center mt-2">Searching database... please wait</p>
                                                    </div>
                                                )}
                                                <div className="flex-1 overflow-y-auto space-y-2 hide-scrollbar mb-4">
                                                    {bulkState.results.map((r, i) => (
                                                        <div key={i} className={`flex items-center p-3 rounded-xl text-sm font-bold shadow-sm animate-spring-up border ${r.duplicate ? 'bg-yellow-500/10 border-yellow-500/20' : r.success ? 'bg-white dark:bg-[#151517] border-black/5 dark:border-white/5' : 'bg-red-500/5 border-red-500/10'}`} style={{animationDelay: `${i * 0.03}s`}}>
                                                            {r.duplicate ? <span className="mr-2 text-yellow-500 text-base">⚠️</span> : r.success ? <Icon.Check s={16} c="text-green-500 mr-2"/> : <Icon.X s={16} c="text-red-500 mr-2"/>}
                                                            <span className="flex-1 truncate">{r.success || r.duplicate ? r.item.title : r.original}</span>
                                                            <span className={`text-[10px] uppercase font-black ml-2 ${r.duplicate ? 'text-yellow-500' : r.success ? 'text-gray-500' : 'text-red-400'}`}>
                                                                {r.duplicate ? 'Already Saved' : r.notFound ? 'Not Found' : r.success ? r.item.type : 'Error'}
                                                            </span>
                                                        </div>
                                                    ))}
                                                </div>
                                                {!bulkState.loading && (
                                                    <div className="flex gap-3">
                                                        <button onClick={() => setBulkState(p=>({...p, preview:false, results:[], progress:0}))} className="w-14 py-4 bg-gray-200 dark:bg-[#2C2C2E] rounded-2xl flex justify-center bouncy-tap"><Icon.ChevronL s={20}/></button>
                                                        <button onClick={commitBulkImport} className="flex-1 py-4 bg-green-500 text-white rounded-2xl font-black bouncy-tap">Commit Valid Items</button>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* SEARCH & AI TAB */}
                                {(addState.tab === 'search' || addState.tab === 'ai') && (
                                    <>
                                        <div className="relative mb-6 animate-spring-up">
                                            {addState.tab === 'ai' ? <Icon.Sparkles s={20} c="absolute left-5 top-[18px] text-purple-500" /> : <Icon.Search s={20} c="absolute left-5 top-[18px] text-gray-400" />}
                                            <input type="text" placeholder={addState.tab === 'ai' ? "e.g. Space movies that make you cry" : "Search database e.g. Matrix (1999)..."} autoFocus value={addState.query} onChange={(e) => setAddState(p => ({...p, query: e.target.value}))} className="w-full bg-white dark:bg-[#151517] text-black dark:text-white rounded-[2rem] py-4 pl-14 pr-6 text-sm font-bold focus:outline-none shadow-sm border border-black/5 dark:border-white/5 transition-all duration-300 focus:shadow-md" />
                                            {addState.tab === 'ai' && <button onClick={runSmartSearch} className="absolute right-2 top-2 bg-purple-500 text-white px-4 py-2.5 rounded-3xl text-xs font-black shadow-sm bouncy-tap">Ask</button>}
                                        </div>
                                        <div className="flex-1 overflow-y-auto pb-10 hide-scrollbar -mx-2 px-2">
                                            {addState.loading && <Icon.Loader s={32} c="text-accent mx-auto mt-10"/>}
                                            <div className="grid gap-3">
                                                {addState.results.map((res, i) => {
                                                    if (res.type === 'person') {
                                                        return (
                                                            <div key={res.id} onClick={() => fetchActor({ id: res.aid, name: res.title, image: res.image })} className="flex items-center p-3 rounded-3xl bg-white dark:bg-[#151517] shadow-sm border border-black/5 dark:border-white/5 animate-spring-up cursor-pointer bouncy-tap" style={{animationDelay: `${i * 0.05}s`}}>
                                                            <div className="w-14 h-14 bg-gray-100 dark:bg-[#1C1C1E] rounded-full overflow-hidden flex-shrink-0 mr-4">
                                                                {res.image ? <img src={res.image} className="w-full h-full object-cover"/> : <div className="w-full h-full flex justify-center items-center"><Icon.User s={24} c="text-gray-400"/></div>}
                                                            </div>
                                                            <div className="flex-1 overflow-hidden">
                                                                <h4 className="font-black text-sm truncate">{res.title}</h4>
                                                                <span className="text-[10px] font-black uppercase px-2 py-1 rounded-lg inline-block mt-1 bg-purple-500/10 text-purple-500">Actor / Actress</span>
                                                            </div>
                                                            <Icon.ChevronL s={18} c="rotate-180 opacity-40 mr-2"/>
                                                            </div>
                                                        );
                                                    }
                                                    const inVault = vault.some(v => v.aid === res.aid && v.type === res.type); 
                                                    const CatInfo = CATEGORIES.find(c => c.id === res.type) || CATEGORIES[0];
                                                    return (
                                                        <div key={res.id} className={`flex items-center p-3 rounded-3xl bg-white dark:bg-[#151517] shadow-sm border border-black/5 dark:border-white/5 animate-spring-up`} style={{animationDelay: `${i * 0.05}s`}}>
                                                            <div onClick={() => openDetail(res)} className="w-14 h-20 bg-gray-100 dark:bg-[#1C1C1E] rounded-2xl overflow-hidden flex-shrink-0 mr-4 cursor-pointer bouncy-tap">
                                                                {res.image ? <img src={res.image} className="w-full h-full object-cover"/> : <div className="w-full h-full flex justify-center items-center">{React.createElement(CatInfo.i, {s: 24, c: CatInfo.c})}</div>}
                                                            </div>
                                                            <div onClick={() => openDetail(res)} className="flex-1 overflow-hidden cursor-pointer">
                                                                <h4 className="font-black text-sm truncate">{res.title}</h4>
                                                                <span className={`text-[10px] font-black uppercase px-2 py-1 rounded-lg inline-block mt-1 ${CatInfo.b} ${CatInfo.c}`}>{res.type} • {res.year}</span>
                                                            </div>
                                                            <button onClick={(e) => { e.stopPropagation(); if(!inVault) { addToVaultFast(res); } }} className={`pr-2 pl-3 py-2 rounded-2xl rubber-btn transition-all duration-200 ${inVault ? 'opacity-50' : 'active:scale-75'}`}>
                                                                {inVault ? <Icon.Check s={24} c="text-green-500" /> : <div className="w-9 h-9 bg-accent rounded-xl flex items-center justify-center shadow-lg shadow-accent/40"><Icon.Plus s={20} c="text-white"/></div>}
                                                            </button>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* DEEP DETAIL MODAL */}
                    <div className={`absolute inset-0 z-[70] bg-[#F2F2F7] dark:bg-[#0A0A0C] flex flex-col transition-all duration-500 ease-out ${viewingItem ? 'translate-y-0 opacity-100' : 'translate-y-full opacity-0'}`}>
                        {renderSafeModal()}
                    </div>

                    {/* ACTOR PROFILE MODAL */}
                    {actorProfile && (
                        <div className="absolute inset-0 z-[80] bg-black/60 backdrop-blur-md flex flex-col justify-end transition-opacity duration-300">
                            <div className="bg-[#F2F2F7] dark:bg-[#0A0A0C] w-full h-[85vh] rounded-t-[2.5rem] shadow-2xl relative flex flex-col pt-6 px-6 animate-spring-up">
                                <button onClick={() => setActorProfile(null)} className="absolute top-4 right-6 bg-gray-200 dark:bg-[#1C1C1E] p-2 rounded-full bouncy-tap z-10"><Icon.X s={20}/></button>
                                {actorProfile.loading ? (
                                    <Icon.Loader s={40} c="m-auto text-accent"/>
                                ) : (
                                    <div className="flex-1 overflow-y-auto hide-scrollbar pb-10 mt-6">
                                        <div className="flex items-center space-x-5 mb-6 animate-spring-up">
                                            <div className="w-24 h-24 rounded-full overflow-hidden bg-gray-200 dark:bg-[#1C1C1E] border border-black/5 dark:border-white/5 flex-shrink-0">{actorProfile.image && <img src={actorProfile.image} className="w-full h-full object-cover"/>}</div>
                                            <div><h2 className="text-2xl font-black mb-1">{actorProfile.name}</h2><span className="text-xs font-bold text-gray-500 uppercase">Actor Profile</span></div>
                                        </div>
                                        
                                        <ExpandableText text={actorProfile.bio} maxChars={220} />
                                        
                                        <h3 className="text-xs font-black text-gray-500 uppercase tracking-wider mb-4 animate-spring-up" style={{animationDelay:"0.2s"}}>Known For</h3>
                                        <div className="grid grid-cols-3 gap-3">
                                            {actorProfile.knownFor?.map((k, i) => (
                                                <div key={i} onClick={() => { setActorProfile(null); openDetail(k); }} className="cursor-pointer bouncy-tap animate-spring-up" style={{animationDelay: `${0.2 + (i * 0.05)}s`}}>
                                                    <div className="h-32 bg-gray-200 dark:bg-[#1C1C1E] rounded-2xl overflow-hidden mb-2 border border-black/5 dark:border-white/5">{k.image && <img src={k.image} className="w-full h-full object-cover"/>}</div>
                                                    <p className="text-[10px] font-bold text-center truncate">{k.title}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body></html>
